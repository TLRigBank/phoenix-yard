<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Phoenix Yard</title>
<style>
  :root {
    --ink: #1c1916;
    --pine: #1B3A2F;
    --sand: #F4EDE1;
    --paper: #FFFBF4;
    --line: #D9D0C0;
    --muted: #4E493F;
    --ember: #C45A28;
    --ok: #DCE8DC;
    --warn: #F3D7B3;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; background: var(--sand); color: var(--ink);
    font: 17px/1.45 "Avenir Next", "Segoe UI", sans-serif;
  }
  button:focus-visible { outline: 3px solid var(--ember); outline-offset: 2px; }
  #app {
    max-width: 430px; margin: 0 auto; min-height: 100dvh;
    background: var(--paper); display: flex; flex-direction: column;
  }
  header { padding: 16px 20px 0; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .brand { font-weight: 700; color: var(--pine); }
  .count { font-size: 16px; color: var(--muted); }
  main { flex: 1; padding: 12px 20px 16px; }
  h1 { font-size: 28px; line-height: 1.15; color: var(--pine); margin: 12px 0 10px; letter-spacing: -0.02em; }
  h1.sm { font-size: 22px; }
  .lead { color: var(--muted); margin: 0 0 18px; }
  .place { margin: 0 0 6px; color: var(--pine); font-weight: 700; }
  .hint { font-size: 16px; color: var(--ink); background: var(--ok); border-radius: 12px; padding: 12px 14px; margin: 0 0 16px; }
  .hint.warn { background: var(--warn); }
  .kept { font-size: 16px; background: var(--warn); border-radius: 12px; padding: 12px 14px; margin: 0 0 12px; }
  footer { padding: 8px 20px 28px; display: flex; gap: 8px; }
  button.pri, button.ghost, button.ans, button.extra {
    border-radius: 14px; min-height: 48px; padding: 12px 16px; font-size: 17px; font-weight: 650; cursor: pointer;
  }
  button.pri { flex: 1; background: var(--pine); color: #fff; border: 0; }
  button.ghost { flex: 1; background: transparent; border: 1px solid var(--line); color: var(--pine); }
  button.ans {
    width: 100%; background: #fff; border: 1px solid var(--line); color: var(--ink);
    text-align: left; margin: 0 0 10px;
  }
  button.ans.on { background: var(--pine); color: #fff; border-color: var(--pine); }
  .yard {
    position: relative; height: 280px; margin: 8px 0 12px;
    background: #EFE6D4; border-radius: 18px; overflow: hidden; border: 1px solid var(--line);
  }
  .gravel-bed { position: absolute; inset: 0; background:
    repeating-linear-gradient(45deg, #e8dcc6 0 8px, #efe6d4 8px 16px); opacity: .55; }
  .house {
    position: absolute; left: 50%; top: 46%; width: 118px; height: 88px;
    transform: translate(-50%, -50%); background: var(--pine); color: #fff;
    border-radius: 8px; display: flex; align-items: center; justify-content: center;
    font-size: 16px; font-weight: 650; z-index: 2;
  }
  .house:after {
    content: ""; position: absolute; top: -22px; left: 12px; right: 12px; height: 28px;
    background: #143028; clip-path: polygon(50% 0, 100% 100%, 0 100%);
  }
  .side {
    position: absolute; border: 2px dashed #b7ab95; background: rgba(255,255,255,.55);
    color: var(--ink); font-size: 14px; font-weight: 650; display: flex; align-items: center;
    justify-content: center; text-align: center; padding: 4px; cursor: pointer; z-index: 3;
  }
  .side.hot { background: #f3d0b8; border-color: var(--ember); color: #7a3210; border-style: solid; }
  .side[data-id="front"] { left: 22%; right: 22%; top: 14px; height: 52px; border-radius: 10px; }
  .side[data-id="back"] { left: 22%; right: 22%; bottom: 14px; height: 52px; border-radius: 10px; }
  .side[data-id="left"] { left: 10px; top: 78px; width: 64px; height: 96px; border-radius: 10px; }
  .side[data-id="right"] { right: 10px; top: 78px; width: 64px; height: 96px; border-radius: 10px; }
  .extra-row { display: flex; gap: 8px; margin: 0 0 8px; }
  button.extra {
    flex: 1; background: #fff; border: 1px solid var(--line); color: var(--muted); font-weight: 650;
  }
  button.extra.on { background: var(--ok); border-color: var(--pine); color: var(--pine); }
  .card {
    background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 14px; margin: 0 0 10px;
  }
  .swatch { height: 56px; border-radius: 10px; margin: 0 0 10px; }
  .top { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
  .name { font-weight: 750; font-size: 18px; }
  .job { font-size: 14px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  .meta { margin: 2px 0 0; font-size: 16px; color: var(--muted); }
  .botanical { margin: 0; font-size: 15px; color: var(--muted); font-style: italic; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
  .mini { font-size: 14px; border-radius: 999px; padding: 4px 8px; background: var(--sand); color: var(--ink); }
  .mini.warn { background: var(--warn); }
  .mini.ok { background: var(--ok); color: var(--pine); }
  .why { margin: 0; font-size: 16px; }
  .same { font-size: 15px; color: var(--pine); margin: 8px 0 0; font-weight: 650; }
  .strip-nav { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .strip-nav strong { color: var(--pine); font-size: 20px; }
  .dogbar {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; margin: 0 0 12px;
  }
  .sum { padding: 12px 0; border-top: 1px solid var(--line); }
  .sum h2 { margin: 0 0 6px; font-size: 18px; color: var(--pine); }
  .sum p { margin: 0 0 4px; }
</style>
</head>
<body>
<div id="app"></div>
<script>
/* Walk only. The twelve plants are tests/fixtures/default.json from engine/match.js. This file does not score. */
const STRIPS = [
  { id: "wall", title: "Afternoon sun", caption: "The side that cooks." },
  { id: "shade", title: "Afternoon shade", caption: "The opposite wall. Morning sun, afternoon shade." },
  { id: "front", title: "Front", caption: "The front bed." },
  { id: "back", title: "Back", caption: "The back bed." },
  { id: "gate", title: "The gate", caption: "Safe to brush past." },
  { id: "pots", title: "The pots", caption: "Small enough for a patio." },
  { id: "gravel", title: "Open gravel", caption: "Blades, a grass that moves, then something low." }
];
const NEXT = {
  wall: "Next — the afternoon wall",
  gate: "Next — the gate",
  pots: "Next — the pots",
  gravel: "Next — open gravel"
};
const PLACE = { front: "Front side", back: "Back side", left: "Left side", right: "Right side" };
const BEARINGS = {
  right: { right: "West", left: "East", front: "North", back: "South" },
  left: { left: "West", right: "East", front: "South", back: "North" },
  front: { front: "West", back: "East", left: "South", right: "North" },
  back: { back: "West", front: "East", left: "North", right: "South" }
};
const KEPT = "Kept off the gate: Jumping cholla. Joints that jump.";
const SESSION = "Oleander and sago stay off the whole list.";

const CARDS = {
  wall: [
    { name: "Red Yucca", botanical: "Hesperaloe parviflora", job: "Bone", texture: "Blades", height: "2–3 ft", colors: ["#9E2B2B"],
      chips: ["Almost no extra water", "Takes afternoon heat", "Grows here already"],
      why: "Bone for the afternoon wall. Almost no extra water. Grows here already." },
    { name: "Parry’s Penstemon", botanical: "Penstemon parryi", job: "Bloom", texture: "Mound", height: "2–4 ft", colors: ["#C46B8A"],
      chips: ["Almost no extra water", "Takes afternoon heat", "Grows here already"],
      why: "Bloom for the afternoon wall. Almost no extra water. Grows here already." },
    { name: "Native Hedgehog", botanical: "Echinocereus engelmannii", job: "Floor", texture: "Blades", height: "1–2 ft", colors: ["#C46B8A"],
      chips: ["Spines", "Almost no extra water", "Takes afternoon heat", "Grows here already"], warn: true,
      why: "Floor for the afternoon wall. Almost no extra water. Keep it off the path." }
  ],
  gate: [
    { name: "Red Yucca", botanical: "Hesperaloe parviflora", job: "Bone", texture: "Blades", height: "2–3 ft", colors: ["#9E2B2B"],
      chips: ["Safe to brush", "Almost no extra water", "Grows here already"],
      why: "Bone for the gate. Almost no extra water. Grows here already.", same: "Same as the afternoon wall" },
    { name: "Desert Honeysuckle", botanical: "Anisacanthus thurberi", job: "Bloom", texture: "Leaves", height: "2–4 ft", colors: ["#D4652F"],
      chips: ["Safe to brush", "Almost no extra water", "Grows here already"],
      why: "Bloom for the gate. Almost no extra water. Grows here already." },
    { name: "Texas Tuberose", botanical: "Manfreda maculosa", job: "Floor", texture: "Blades", height: "0.5–1 ft", colors: ["#C46B8A"],
      chips: ["Safe to brush", "Almost no extra water", "Grows here already"],
      why: "Floor for the gate. Almost no extra water. Grows here already." }
  ],
  pots: [
    { name: "Texas Tuberose", botanical: "Manfreda maculosa", job: "Bone", texture: "Blades", height: "0.5–1 ft", colors: ["#C46B8A"],
      chips: ["Fits a pot", "Almost no extra water", "Grows here already"],
      why: "Bone for the pots. Almost no extra water. Grows here already.", same: "Same as the gate" },
    { name: "Desert Marigold", botanical: "Baileya multiradiata", job: "Bloom", texture: "Mound", height: "1–2 ft", colors: ["#C8960A"],
      chips: ["Fits a pot", "Almost no extra water", "Grows here already"],
      why: "Bloom for the pots. Almost no extra water. Grows here already." },
    { name: "Beavertail Prickly Pear", botanical: "Opuntia basilaris", job: "Floor", texture: "Mound", height: "1–2 ft", colors: ["#C46B8A"],
      chips: ["Spines", "Fits a pot", "Almost no extra water", "Grows here already"], warn: true,
      why: "Floor for the pots. Almost no extra water. Keep it off the path." }
  ],
  gravel: [
    { name: "Banana Yucca", botanical: "Yucca baccata", job: "Bone", texture: "Blades", height: "3–5 ft", colors: ["#8AA0B4"],
      chips: ["Spines", "Almost no extra water", "Grows here already"], warn: true,
      why: "Bone for the gravel. Almost no extra water. Keep it off the path." },
    { name: "Pine Muhly", botanical: "Muhlenbergia dubia", job: "Bloom", texture: "Cloud", height: "2–3 ft", colors: ["#C5CDC6"],
      chips: ["Almost no extra water", "Grows here already"],
      why: "Bloom for the gravel. Almost no extra water. Grows here already." },
    { name: "Trailing Indigo", botanical: "Dalea greggii", job: "Floor", texture: "Mound", height: "0.5–1 ft", colors: ["#6B4F8A"],
      chips: ["Almost no extra water", "Grows here already", "Feeds the soil"],
      why: "Floor for the gravel. Almost no extra water. Feeds the soil." }
  ]
};

const ALT = {
  wall: [
    { name: "Desert Spoon", botanical: "Dasylirion wheeleri", job: "Bone", texture: "Blades", height: "3–5 ft", colors: ["#8AA0B4"],
      chips: ["Almost no extra water", "Takes afternoon heat", "Grows here already"],
      why: "Bone for the afternoon wall. Almost no extra water. Grows here already." },
    { name: "Flame Honeysuckle", botanical: "Anisacanthus quadrifidus", job: "Bloom", texture: "Leaves", height: "3–4 ft", colors: ["#D4652F"],
      chips: ["Almost no extra water", "Takes afternoon heat"],
      why: "Bloom for the afternoon wall. Almost no extra water." },
    { name: "Beavertail Prickly Pear", botanical: "Opuntia basilaris", job: "Floor", texture: "Mound", height: "1–2 ft", colors: ["#C46B8A"],
      chips: ["Spines", "Almost no extra water", "Takes afternoon heat", "Grows here already"], warn: true,
      why: "Floor for the afternoon wall. Almost no extra water. Keep it off the path." }
  ]
};

CARDS.shade = [
  { name: "Foxtail Agave", botanical: "Agave attenuata", job: "Bone", texture: "Blades", height: "4–5 ft", colors: ["#8AA0B4"],
    chips: ["Afternoon shade", "Almost no extra water"],
    why: "Bone for the afternoon shade wall. Almost no extra water." },
  { name: "Parry’s Penstemon", botanical: "Penstemon parryi", job: "Bloom", texture: "Mound", height: "2–4 ft", colors: ["#C46B8A"],
    chips: ["Afternoon shade", "Almost no extra water", "Grows here already"],
    why: "Bloom for the afternoon shade wall. Almost no extra water." },
  { name: "Trailing Indigo", botanical: "Dalea greggii", job: "Floor", texture: "Mound", height: "0.5–1 ft", colors: ["#6B4F8A"],
    chips: ["Afternoon shade", "Almost no extra water", "Feeds the soil"],
    why: "Floor for the afternoon shade wall. Almost no extra water. Feeds the soil." }
];
CARDS.front = CARDS.wall.map((c) => Object.assign({}, c, { why: "Bone for the front bed.".replace("Bone", c.job) + " Not the roasting wall." }));
CARDS.back = CARDS.front;

const QUESTIONS = [
  { key: "kids", title: "Do kids play in the plants?",
    hint: "If yes, we hide plants that can make a child very sick.",
    answers: [["No", false], ["Yes", true]] },
  { key: "chew", title: "Does a dog or cat chew leaves?",
    hint: "If yes, sago and oleander leave the list. Aloe stays, marked as a problem if they chew.",
    answers: [["No", false], ["Yes — they chew", true]] },
  { key: "wildlife", title: "Do you want birds and butterflies?",
    hint: "If yes, we keep plants that feed them. Native milkweed can stay when kids or a pet chew, and the card says it is still toxic.",
    answers: [["Not a goal", false], ["Yes", true]] },
  { key: "care", title: "How much time do you have?",
    hint: "Almost none means gravel plants. Weekends can add one extra-water plant at the gate or in a pot.",
    answers: [["Almost none", "Low"], ["Weekends", "Weekend"], ["It’s a hobby", "Hobby"]] }
];

const state = {
  screen: "home", q: 0, hot: "right", scale: null,
  extras: { wall: true, shade: true, front: true, back: true, gate: true, pots: true, gravel: true },
  surfaces: { front: [], left: [], right: [], back: [] },
  cover: { front: "none", left: "none", right: "none", back: "none" },
  block_wall: { front: false, left: false, right: false, back: false },
  kids: null, chew: null, wildlife: true, care: null,
  strip: 0, lastChange: "", usedAlt: {}
};

try {
  const saved = JSON.parse(localStorage.getItem("phoenix-yard-v2") || "null");
  if (saved && saved.hot && saved.extras) {
    Object.assign(state, saved, { lastChange: "" });
    state.cover = Object.assign({ front: "none", left: "none", right: "none", back: "none" }, state.cover || {});
    state.block_wall = Object.assign({ front: false, left: false, right: false, back: false }, state.block_wall || {});
  }
} catch (err) { /* private mode */ }

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"]/g, (c) => ({ "&": "&", "<": "<", ">": ">", '"': """ }[c]));
}
function placeLine() {
  return BEARINGS[state.hot][state.hot] + " · afternoon sun";
}
function sideLabel(id) {
  return BEARINGS[state.hot][id];
}
function visibleStrips() {
  return STRIPS.filter((strip) => state.extras[strip.id]);
}
function advanceQ() {
  const key = QUESTIONS[state.q].key;
  if (state[key] === null || state[key] === undefined) return;
  if (state.q < QUESTIONS.length - 1) state.q += 1;
  else state.screen = "pieces";
}

function house(showExtras) {
  const sides = ["front", "left", "right", "back"].map((id) => {
    const hot = state.hot === id;
    const label = sideLabel(id);
    return `<button class="side ${hot ? "hot" : ""}" data-act="hot" data-id="${id}">${hot ? "West" : label}</button>`;
  }).join("");
  const extras = showExtras ? `<div class="extra-row">
      <button class="extra ${state.extras.wall ? "on" : ""}" data-act="extra" data-id="wall">Sun</button>
      <button class="extra ${state.extras.shade ? "on" : ""}" data-act="extra" data-id="shade">Shade</button>
      <button class="extra ${state.extras.front ? "on" : ""}" data-act="extra" data-id="front">Front</button>
      <button class="extra ${state.extras.back ? "on" : ""}" data-act="extra" data-id="back">Back</button>
      <button class="extra ${state.extras.gate ? "on" : ""}" data-act="extra" data-id="gate">Gate</button>
      <button class="extra ${state.extras.pots ? "on" : ""}" data-act="extra" data-id="pots">Pots</button>
      <button class="extra ${state.extras.gravel ? "on" : ""}" data-act="extra" data-id="gravel">Gravel</button>
    </div>` : "";
  return `<div class="yard"><div class="gravel-bed"></div>${sides}<div class="house">House</div></div>${extras}`;
}

function screenHome() {
  return `
    <header><span class="brand">Phoenix Yard</span></header>
    <main>
      <h1>Tap the wall that cooks in the afternoon.</h1>
      <p class="lead">That is only which side gets the sun. Next you say what you are planting.</p>
      ${house(false)}
    </main>
    <footer><button class="pri" data-act="go" data-to="project">That’s the afternoon side</button></footer>`;
}

function applyScale(scale) {
  state.scale = scale;
  const map = {
    pots: { wall: false, shade: false, front: false, back: false, gate: false, pots: true, gravel: false },
    bed: { wall: true, shade: false, front: false, back: false, gate: false, pots: false, gravel: true },
    path: { wall: false, shade: false, front: false, back: false, gate: true, pots: false, gravel: false },
    yard: { wall: true, shade: true, front: true, back: true, gate: true, pots: true, gravel: true },
    unsure: { wall: true, shade: true, front: true, back: true, gate: true, pots: true, gravel: true }
  };
  state.extras = Object.assign({}, map[scale]);
}

function screenProject() {
  const opts = [
    ["pots", "Pots on the patio"],
    ["bed", "One bed"],
    ["path", "Gate and path"],
    ["yard", "Whole yard"],
    ["unsure", "Not sure"]
  ];
  const btns = opts.map(([id, label]) =>
    `<button class="ans ${state.scale === id ? "on" : ""}" data-act="scale" data-id="${id}">${label}</button>`
  ).join("");
  return `
    <header><span class="brand">Phoenix Yard</span></header>
    <main>
      <p class="place">${esc(placeLine())}</p>
      <h1 class="sm">What are you planting?</h1>
      <p class="lead">The afternoon side is already marked. This chooses which pieces start on.</p>
      ${btns}
    </main>
    <footer>
      <button class="ghost" data-act="go" data-to="home">Back</button>
      <button class="pri" data-act="after-project">Next</button>
    </footer>`;
}

function screenProjectSide() {
  const sides = ["front", "left", "right", "back"].map((id) =>
    `<button class="ans ${state.project_side === id ? "on" : ""}" data-act="project-side" data-id="${id}">${sideLabel(id)}${id === state.hot ? " · this project is on the west wall" : ""}</button>`
  ).join("");
  return `
    <header><span class="brand">Phoenix Yard</span></header>
    <main>
      <p class="place">${esc(placeLine())}</p>
      <h1 class="sm">Which side is this project on?</h1>
      <p class="lead">Pots, a bed, and a gate live on one wall. Whole yard skips this.</p>
      ${house(false)}
      ${sides}
    </main>
    <footer>
      <button class="ghost" data-act="go" data-to="project">Back</button>
      <button class="pri" data-act="go" data-to="ask">Next</button>
    </footer>`;
}

function screenAsk() {
  const q = QUESTIONS[state.q];
  const btns = q.answers.map(([label, val]) => {
    const on = state[q.key] === val;
    return `<button class="ans ${on ? "on" : ""}" data-act="answer" data-key="${q.key}" data-val="${val}">${esc(label)}</button>`;
  }).join("");
  return `
    <header><span class="brand">Phoenix Yard</span><span class="count">${state.q + 1} of 4</span></header>
    <main>
      <h1 class="sm">${esc(q.title)}</h1>
      <p class="hint">${esc(q.hint)}</p>
      ${btns}
    </main>
    <footer>
      <button class="ghost" data-act="backq">Back</button>
      <button class="pri" data-act="nextq">Next</button>
    </footer>`;
}

function screenPieces() {
  return `
    <header><span class="brand">Phoenix Yard</span></header>
    <main>
      <h1 class="sm">Keep the pieces this project uses.</h1>
      <p class="lead">Afternoon sun is already marked. Turn the wall off if you are not planting that bed.</p>
      ${house(true)}
    </main>
    <footer>
      <button class="ghost" data-act="back-pieces">Back</button>
      <button class="pri" data-act="go" data-to="micro">Next — shade and walls</button>
    </footer>`;
}

function cardEl(c) {
  const chips = (c.chips || []).map((t) => {
    const warn = c.warn && /spine|path|chew|toxic/i.test(t) || /Spines|Problem|Joints|toxic/i.test(t);
    return `<span class="mini ${warn ? "warn" : "ok"}">${esc(t)}</span>`;
  }).join("");
  return `<article class="card">
    <div class="swatch" style="background:linear-gradient(135deg, ${c.colors[0]}, #1B3A2F)"></div>
    <div class="top"><span class="name">${esc(c.name)}</span><span class="job">${esc(c.job)}</span></div>
    <p class="botanical">${esc(c.botanical)}</p>
    <p class="meta">${esc(c.texture)} · ${esc(c.height)}</p>
    <div class="chips">${chips}</div>
    <p class="why">${esc(c.why)}</p>
    ${c.same ? `<p class="same">${esc(c.same)}</p>` : ""}
  </article>`;
}

function screenMicro() {
  const sides = [
    ["right", sideLabel("right")],
    ["left", sideLabel("left")],
    ["front", sideLabel("front")],
    ["back", sideLabel("back")]
  ];
  const covers = [["none", "Open"], ["tree", "Tree"], ["eave", "Eave"], ["structure", "Patio cover"]];
  const rows = sides.map(([id, label]) => {
    const hot = state.hot === id ? " · afternoon sun" : "";
    const shade = ({ front: "back", back: "front", left: "right", right: "left" }[state.hot] === id) ? " · afternoon shade" : "";
    const coverBtns = covers.map(([cid, clabel]) =>
      `<button class="extra ${state.cover[id] === cid ? "on" : ""}" data-act="cover" data-side="${id}" data-id="${cid}">${clabel}</button>`
    ).join("");
    return `<section class="sum">
      <h2>${label}${hot}${shade}</h2>
      <p class="meta">What is on this side?</p>
      <div class="extra-row">
        ${["bed", "pots", "gate", "gravel"].map((kind) => {
          const on = (state.surfaces[id] || []).indexOf(kind) >= 0;
          return `<button class="extra ${on ? "on" : ""}" data-act="surface" data-side="${id}" data-id="${kind}">${kind}</button>`;
        }).join("")}
      </div>
      <p class="meta">What already shades this side?</p>
      <div class="extra-row">${coverBtns}</div>
      <button class="extra ${state.block_wall[id] ? "on" : ""}" data-act="block" data-id="${id}" style="width:100%;margin-top:8px">Block wall against the plants</button>
    </section>`;
  }).join("");
  return `
    <header><span class="brand">Phoenix Yard</span></header>
    <main>
      <h1 class="sm">What is already on each side?</h1>
      <p class="lead">A tree or patio cover changes the quote. A block wall is its own strip.</p>
      ${rows}
    </main>
    <footer>
      <button class="ghost" data-act="go" data-to="pieces">Back</button>
      <button class="pri" data-act="go" data-to="results">See the plants</button>
    </footer>`;
}

function screenResults() {
  const strips = visibleStrips();
  if (state.strip >= strips.length) state.strip = 0;
  const strip = strips[state.strip];
  const cards = (state.usedAlt[strip.id] && ALT[strip.id]) ? ALT[strip.id] : CARDS[strip.id];
  const rerollLabel = state.usedAlt[strip.id] ? "Back to this strip’s first set" : "Three others for this strip";
  const banner = state.lastChange
    ? `<p class="hint warn">${esc(state.lastChange)}</p>`
    : (state.chew || state.kids ? `<p class="hint">${esc(SESSION)}</p>` : "");
  const kept = strip.id === "gate" ? `<p class="kept">${esc(KEPT)}</p>` : "";
  const next = state.strip >= strips.length - 1 ? "That's the yard" : NEXT[strips[state.strip + 1].id];
  return `
    <header><span class="brand">Phoenix Yard</span><span class="count">${state.strip + 1} of ${strips.length}</span></header>
    <main>
      <p class="place">${esc(placeLine())}</p>
      <div class="strip-nav"><strong>${esc(strip.title)}</strong></div>
      <p class="lead">${esc(strip.caption)}</p>
      <div class="dogbar">
        <span>A dog or cat chews leaves</span>
        <button class="extra ${state.chew ? "on" : ""}" data-act="flipchew" style="flex:0">${state.chew ? "On" : "Off"}</button>
      </div>
      ${banner}
      ${kept}
      ${cards.map(cardEl).join("")}
      <button class="ghost" data-act="reroll" style="width:100%;margin-top:8px">${esc(rerollLabel)}</button>

    </main>
    <footer>
      <button class="ghost" data-act="go" data-to="pieces">Yard</button>
      <button class="pri" data-act="nextstrip">${esc(next)}</button>
    </footer>`;
}

function screenYard() {
  const strips = visibleStrips();
  const blocks = strips.map((strip) => {
    const names = CARDS[strip.id].map((c) => esc(c.name)).join(" · ");
    const kept = strip.id === "gate" ? `<p class="meta">${esc(KEPT)}</p>` : "";
    return `<section class="sum"><h2>${esc(strip.title)}</h2><p>${names}</p>${kept}</section>`;
  }).join("");
  const note = state.chew || state.kids ? `<p class="hint">${esc(SESSION)}</p>` : "";
  return `
    <header><span class="brand">Phoenix Yard</span></header>
    <main>
      <p class="place">${esc(placeLine())}</p>
      <h1 class="sm">That's the yard.</h1>
      <p class="lead">Three plants for each piece you kept. Not a catalog.</p>
      ${note}
      ${blocks}
    </main>
    <footer>
      <button class="ghost" data-act="back-yard">Back</button>
      <button class="pri" data-act="reset">Start over</button>
    </footer>`;
}

function render() {
  const map = { home: screenHome, project: screenProject, projectside: screenProjectSide, ask: screenAsk, pieces: screenPieces, micro: screenMicro, results: screenResults, yard: screenYard };
  const screen = map[state.screen] || screenHome;
  document.getElementById("app").innerHTML = screen();
  try {
    const { lastChange, ...rest } = state;
    localStorage.setItem("phoenix-yard-v2", JSON.stringify(rest));
  } catch (err) { /* ignore */ }
}

function parseVal(v) {
  if (v === "true") return true;
  if (v === "false") return false;
  return v;
}

document.getElementById("app").addEventListener("click", (e) => {
  const b = e.target.closest("[data-act]");
  if (!b) return;
  const act = b.dataset.act;
  if (act === "cover") state.cover[b.dataset.side] = b.dataset.id;
  if (act === "block") state.block_wall[b.dataset.id] = !state.block_wall[b.dataset.id];
  if (act === "go") {
    if (b.dataset.to === "ask") {
      if (!state.scale) applyScale("unsure");
      state.q = 0;
    }
    if (b.dataset.to === "results") {
      if (!visibleStrips().length) return;
      state.strip = 0;
    }
    state.screen = b.dataset.to;
    state.lastChange = "";
  }
  if (act === "hot") state.hot = b.dataset.id;
  if (act === "scale") applyScale(b.dataset.id);
  if (act === "after-project") {
    state.screen = (state.scale === "pots" || state.scale === "bed" || state.scale === "path") ? "projectside" : "ask";
    if (!state.scale) applyScale("unsure");
  }
  if (act === "surface") {
    const side = b.dataset.side;
    const kind = b.dataset.id;
    const list = (state.surfaces[side] || []).slice();
    const i = list.indexOf(kind);
    if (i >= 0) list.splice(i, 1);
    else list.push(kind);
    state.surfaces[side] = list;
  }
  if (act === "extra") state.extras[b.dataset.id] = !state.extras[b.dataset.id];
  if (act === "answer") {
    state[b.dataset.key] = parseVal(b.dataset.val);
    advanceQ();
  }
  if (act === "nextq") advanceQ();
  if (act === "backq") {
    if (state.q === 0) state.screen = "project";
    else state.q -= 1;
  }
  if (act === "back-pieces") {
    state.screen = "ask";
    state.q = QUESTIONS.length - 1;
  }
  if (act === "nextstrip") {
    const n = visibleStrips().length;
    state.lastChange = "";
    if (state.strip >= n - 1) state.screen = "yard";
    else state.strip += 1;
  }
  if (act === "back-yard") {
    state.screen = "results";
    state.strip = Math.max(0, visibleStrips().length - 1);
  }
  if (act === "reroll") {
    const strips = visibleStrips();
    const id = strips[state.strip] && strips[state.strip].id;
    if (id) state.usedAlt[id] = !state.usedAlt[id];
    state.lastChange = state.usedAlt[id]
      ? "Another legal set for this strip. The live engine uses exclude so these ids do not come back."
      : "First set for this strip.";
  }
  if (act === "flipchew") {
    state.chew = !state.chew;
    state.lastChange = state.chew
      ? "This strip was already safe to chew. Oleander and sago stay off the whole list."
      : "Chew is off. This strip did not change.";
  }
  if (act === "reset") {
    try { localStorage.removeItem("phoenix-yard-v2"); } catch (err) { /* ignore */ }
    state.screen = "home";
    state.q = 0;
    state.hot = "right";
    state.extras = { wall: true, gate: true, pots: true, gravel: true };
    state.scale = null;
    state.cover = { front: "none", left: "none", right: "none", back: "none" };
    state.block_wall = { front: false, left: false, right: false, back: false };
    state.kids = null;
    state.chew = null;
    state.wildlife = true;
    state.care = null;
    state.strip = 0;
    state.lastChange = "";
  }
  render();
});

render();
</script>
</body>
</html>
