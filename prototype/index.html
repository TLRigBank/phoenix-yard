<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Phoenix Yard</title>
<style>
  :root {
    --ink: #1c1916;
    --pine: #1B3A2F;
    --sand: #F4EDE1;
    --paper: #FFFBF4;
    --line: #D9D0C0;
    --muted: #4E493F;
    --ember: #C45A28;
    --west: #f3d0b8;
    --east: #e4eee8;
    --south: #efe3c4;
    --north: #d7e0e8;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--sand); color: var(--ink); font: 17px/1.4 "Avenir Next", "Segoe UI", sans-serif; }
  button:focus-visible { outline: 3px solid var(--ember); outline-offset: 2px; }
  #app { max-width: 430px; margin: 0 auto; min-height: 100dvh; background: var(--paper); display: flex; flex-direction: column; }
  header { padding: 14px 18px 0; display: flex; justify-content: space-between; align-items: center; }
  .brand { font-weight: 800; color: var(--pine); }
  main { flex: 1; padding: 8px 18px 12px; }
  h1 { font-size: 26px; line-height: 1.15; color: var(--pine); margin: 8px 0 8px; }
  h1.sm { font-size: 20px; }
  .lead, .place { color: var(--muted); margin: 0 0 10px; }
  .place { color: var(--pine); font-weight: 700; }
  footer { padding: 8px 18px 26px; display: flex; gap: 8px; }
  button.pri, button.ghost, button.ans, button.chip {
    border-radius: 14px; min-height: 46px; padding: 10px 14px; font-size: 16px; font-weight: 700; cursor: pointer;
  }
  button.pri { flex: 1; background: var(--pine); color: #fff; border: 0; }
  button.ghost { flex: 1; background: transparent; border: 1px solid var(--line); color: var(--pine); }
  button.ans { width: 100%; background: #fff; border: 1px solid var(--line); text-align: left; margin: 0 0 8px; }
  button.ans.on { background: var(--pine); color: #fff; border-color: var(--pine); }
  .row { display: flex; gap: 8px; flex-wrap: wrap; margin: 0 0 8px; }
  button.chip { flex: 1; min-width: 64px; background: #fff; border: 1px solid var(--line); color: var(--muted); }
  button.chip.on { background: var(--pine); color: #fff; border-color: var(--pine); }
  button.chip.weston { background: var(--west); color: #7a3210; border-color: var(--ember); }

  .yard { position: relative; height: 278px; margin: 0 0 10px; background: #e8dcc6; border-radius: 18px; overflow: hidden; border: 1px solid var(--line); }
  .street { position: absolute; left: 0; right: 0; top: 0; height: 30px; background: #5f5c58; color: #fff; font-size: 11px; font-weight: 800; letter-spacing: .14em; display: flex; align-items: center; justify-content: center; text-transform: uppercase; z-index: 5; }
  .walk { position: absolute; left: 50%; top: 30px; width: 20px; height: 36px; margin-left: -10px; background: #cfc4b0; z-index: 3; }
  .house { position: absolute; left: 50%; top: 54%; width: 112px; height: 88px; margin-left: -56px; margin-top: -44px; background: var(--pine); border-radius: 6px; z-index: 4; box-shadow: 0 8px 16px rgba(20,48,40,.2); }
  .roof { position: absolute; top: -18px; left: 8px; right: 8px; height: 22px; background: #143028; clip-path: polygon(50% 0, 100% 100%, 0 100%); }
  .door { position: absolute; top: 0; left: 50%; width: 20px; height: 26px; margin-left: -10px; background: #c4a574; border-radius: 3px 3px 0 0; }
  .htag { position: absolute; left: 0; right: 0; bottom: 8px; text-align: center; color: #fff; font-size: 12px; font-weight: 800; letter-spacing: .08em; }
  .wall {
    position: absolute; border: 2px dashed #b7ab95; background: rgba(255,255,255,.55);
    color: var(--ink); font-size: 12px; font-weight: 800; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center; gap: 3px; z-index: 3; cursor: pointer;
  }
  .wall[data-side="front"] { left: 22%; right: 22%; top: 34px; height: 42px; border-radius: 10px; }
  .wall[data-side="back"] { left: 22%; right: 22%; bottom: 8px; height: 42px; border-radius: 10px; }
  .wall[data-side="left"] { left: 6px; top: 84px; width: 68px; height: 108px; border-radius: 10px; }
  .wall[data-side="right"] { right: 6px; top: 84px; width: 68px; height: 108px; border-radius: 10px; }
  .wall.W { background: var(--west); border-color: var(--ember); border-style: solid; color: #7a3210; }
  .wall.E { background: var(--east); }
  .wall.S { background: var(--south); }
  .wall.N { background: var(--north); }
  .wall.sel { box-shadow: inset 0 0 0 3px var(--pine); transform: scale(1.04); }
  .marks { font-size: 11px; font-weight: 700; color: var(--muted); }
  .wall.W .marks { color: #7a3210; }
  .canopy { position: absolute; width: 34px; height: 22px; border-radius: 16px; background: rgba(27,58,47,.35); z-index: 6; pointer-events: none; }
  .canopy.front { left: 50%; top: 36px; margin-left: -17px; }
  .canopy.back { left: 50%; bottom: 10px; margin-left: -17px; }
  .canopy.left { left: 18px; top: 118px; }
  .canopy.right { right: 18px; top: 118px; }
  .blockline { position: absolute; background: #8b8173; z-index: 2; pointer-events: none; }
  .blockline.front { left: 24%; right: 24%; top: 32px; height: 6px; }
  .blockline.back { left: 24%; right: 24%; bottom: 6px; height: 6px; }
  .blockline.left { left: 4px; top: 88px; width: 6px; height: 100px; }
  .blockline.right { right: 4px; top: 88px; width: 6px; height: 100px; }

  .card { background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 12px; margin: 0 0 8px; }
  .swatch { height: 44px; border-radius: 10px; margin: 0 0 8px; }
  .top { display: flex; justify-content: space-between; gap: 8px; }
  .name { font-weight: 800; }
  .job { font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  .botanical { margin: 0; font-size: 14px; color: var(--muted); font-style: italic; }
  .why { margin: 6px 0 0; }
  .mini { font-size: 13px; border-radius: 999px; padding: 3px 8px; background: #e8f0e8; color: var(--pine); margin-right: 4px; }
</style>
</head>
<body>
<div id="app"></div>
<script>
const FRONT_FACES = {
  N: { front: "N", back: "S", left: "W", right: "E" },
  S: { front: "S", back: "N", left: "E", right: "W" },
  E: { front: "E", back: "W", left: "N", right: "S" },
  W: { front: "W", back: "E", left: "S", right: "N" }
};
const NAME = { N: "North", S: "South", E: "East", W: "West" };
const PIECES = ["bed", "pots", "gate", "gravel", "block_wall"];
const COVERS = [["none", "Open"], ["tree", "Tree"], ["eave", "Eave"], ["structure", "Cover"]];
const ASK = [
  { key: "kids", title: "Kids in this yard?", answers: [["No", false], ["Yes", true]] },
  { key: "chew", title: "A pet that chews plants?", answers: [["No", false], ["Yes", true]] },
  { key: "wildlife", title: "Feed birds or butterflies?", answers: [["Not a goal", false], ["Yes", true]] },
  { key: "care", title: "How much time?", answers: [["Almost none", "Low"], ["Weekends", "Weekend"], ["Hobby", "Hobby"]] }
];
const DEMO = {
  W: [
    { name: "Red Yucca", botanical: "Hesperaloe parviflora", job: "Bone", color: "#9E2B2B", why: "Holds the west wall. Almost no extra water." },
    { name: "Parry’s Penstemon", botanical: "Penstemon parryi", job: "Bloom", color: "#C46B8A", why: "Flower on the west wall. Almost no extra water." },
    { name: "Native Hedgehog", botanical: "Echinocereus engelmannii", job: "Floor", color: "#C46B8A", why: "Low on the west wall. Keep it off the path." }
  ],
  E: [
    { name: "Desert Honeysuckle", botanical: "Anisacanthus thurberi", job: "Bone", color: "#D4652F", why: "Morning sun, house shade after noon." },
    { name: "Damianita", botanical: "Chrysactinia mexicana", job: "Bloom", color: "#C8960A", why: "Low flower for the east wall." },
    { name: "Texas Tuberose", botanical: "Manfreda maculosa", job: "Floor", color: "#C46B8A", why: "Fits the east edge." }
  ],
  S: [
    { name: "Banana Yucca", botanical: "Yucca baccata", job: "Bone", color: "#8AA0B4", why: "Long south sun. Almost no extra water." },
    { name: "Flame Honeysuckle", botanical: "Anisacanthus quadrifidus", job: "Bloom", color: "#D4652F", why: "Flower for the south wall." },
    { name: "Beavertail", botanical: "Opuntia basilaris", job: "Floor", color: "#C46B8A", why: "Low on the south gravel." }
  ],
  N: [
    { name: "Beargrass", botanical: "Nolina microcarpa", job: "Bone", color: "#8AA0B4", why: "Takes the north frost pocket." },
    { name: "Autumn Sage", botanical: "Salvia greggii", job: "Bloom", color: "#9E2B2B", why: "Flower in north shade." },
    { name: "Trailing Indigo", botanical: "Dalea greggii", job: "Floor", color: "#6B4F8A", why: "Low cover on the north side." }
  ]
};
const ALT = {
  W: [
    { name: "Desert Spoon", botanical: "Dasylirion wheeleri", job: "Bone", color: "#8AA0B4", why: "Another west bone." },
    { name: "Desert Marigold", botanical: "Baileya multiradiata", job: "Bloom", color: "#C8960A", why: "Another west bloom." },
    { name: "Beavertail", botanical: "Opuntia basilaris", job: "Floor", color: "#C46B8A", why: "Another west floor." }
  ]
};

const state = {
  mode: "aim",
  front: "N",
  selected: "front",
  surfaces: { front: [], left: [], right: [], back: [] },
  cover: { front: "none", left: "none", right: "none", back: "none" },
  kids: false, chew: false, wildlife: true, care: "Low",
  ask: 0, asked: false,
  alt: {},
  last: ""
};

function mapOf() { return FRONT_FACES[state.front]; }
function bearing(side) { return mapOf()[side]; }
function westSide() { return Object.keys(mapOf()).find((s) => mapOf()[s] === "W"); }
function hasAny() {
  return ["front", "left", "right", "back"].some((s) => (state.surfaces[s] || []).length);
}
function marks(side) {
  const list = state.surfaces[side] || [];
  const bits = [];
  if (list.includes("bed")) bits.push("bed");
  if (list.includes("pots")) bits.push("pots");
  if (list.includes("gate")) bits.push("gate");
  if (list.includes("gravel")) bits.push("gravel");
  if (list.includes("block_wall")) bits.push("wall");
  if (state.cover[side] && state.cover[side] !== "none") bits.push(state.cover[side]);
  return bits.slice(0, 3).join(" · ");
}
function activePiece(side) {
  const list = state.surfaces[side] || [];
  return list[0] || (state.cover[side] !== "none" ? "bed" : null);
}
function stripKey(side) {
  return bearing(side) + "-" + (activePiece(side) || "bed");
}

function yard() {
  const sides = ["front", "left", "right", "back"].map((side) => {
    const b = bearing(side);
    const label = side === "front" ? "Front · " + NAME[b] : NAME[b];
    return `<button class="wall ${b} ${state.selected === side ? "sel" : ""}" data-act="pick" data-id="${side}">
      <span>${label}</span><span class="marks">${marks(side)}</span>
    </button>`;
  }).join("");
  const trees = ["front", "left", "right", "back"].filter((s) => state.cover[s] === "tree").map((s) => `<div class="canopy ${s}"></div>`).join("");
  const blocks = ["front", "left", "right", "back"].filter((s) => (state.surfaces[s] || []).includes("block_wall")).map((s) => `<div class="blockline ${s}"></div>`).join("");
  return `<div class="yard">
    <div class="street">Street</div>
    <div class="walk"></div>
    ${blocks}${sides}${trees}
    <div class="house"><span class="roof"></span><span class="door"></span><span class="htag">Front</span></div>
  </div>`;
}

function tray() {
  const side = state.selected;
  const list = state.surfaces[side] || [];
  const pcs = PIECES.map((p) => {
    const on = list.includes(p);
    return `<button class="chip ${on ? "on" : ""}" data-act="stamp" data-id="${p}">${p === "block_wall" ? "Block" : p}</button>`;
  }).join("");
  const cvs = COVERS.map(([id, label]) =>
    `<button class="chip ${state.cover[side] === id ? "on" : ""}" data-act="cover" data-id="${id}">${label}</button>`
  ).join("");
  return `<p class="place">${NAME[bearing(side)]} wall</p>
    <div class="row">${pcs}</div>
    <div class="row">${cvs}</div>`;
}

function cards() {
  const b = bearing(state.selected);
  const pack = (state.alt[stripKey(state.selected)] && ALT[b]) ? ALT[b] : (DEMO[b] || DEMO.W);
  return pack.map((c) => `<article class="card">
    <div class="swatch" style="background:${c.color}"></div>
    <div class="top"><span class="name">${c.name}</span><span class="job">${c.job}</span></div>
    <p class="botanical">${c.botanical}</p>
    <p class="why">${c.why}</p>
  </article>`).join("");
}

function screenAim() {
  const btns = ["N", "S", "E", "W"].map((id) =>
    `<button class="ans ${state.front === id ? "on" : ""}" data-act="front" data-id="${id}">Front faces ${NAME[id]}</button>`
  ).join("");
  return `<header><span class="brand">Phoenix Yard</span></header>
    <main>
      <h1>Which way does the front face?</h1>
      <p class="lead">Street is the top. Door is the front. West will light itself — that wall cooks in the afternoon.</p>
      ${yard()}
      ${btns}
    </main>
    <footer><button class="pri" data-act="mode" data-id="yard">That’s the front</button></footer>`;
}

function screenYard() {
  const q = ASK[state.ask];
  const household = state.asked ? "" : `<h1 class="sm">${q.title}</h1>
    ${q.answers.map(([label, val]) =>
      `<button class="ans ${String(state[q.key]) === String(val) ? "on" : ""}" data-act="answer" data-key="${q.key}" data-val="${val}">${label}</button>`
    ).join("")}`;
  return `<header><span class="brand">Phoenix Yard</span></header>
    <main>
      <p class="place">Front faces ${NAME[state.front]} · west is the ${westSide()} wall</p>
      ${yard()}
      ${household || tray()}
    </main>
    <footer>
      <button class="ghost" data-act="mode" data-id="${state.asked ? "aim" : "yard"}">${state.asked ? "Aim" : "Stay"}</button>
      <button class="pri" data-act="${state.asked ? "quote" : "nextq"}">${state.asked ? "See the plants" : "Next"}</button>
    </footer>`;
}

function screenQuote() {
  const piece = activePiece(state.selected) || "bed";
  return `<header><span class="brand">Phoenix Yard</span></header>
    <main>
      <p class="place">${NAME[bearing(state.selected)]} · ${piece}</p>
      ${yard()}
      ${state.last ? `<p class="lead">${state.last}</p>` : ""}
      ${cards()}
      <button class="ghost" data-act="reroll" style="width:100%">Three others for this wall</button>
    </main>
    <footer>
      <button class="ghost" data-act="mode" data-id="yard">Map</button>
      <button class="pri" data-act="flipchew">${state.chew ? "Chew on" : "Chew off"}</button>
    </footer>`;
}

function render() {
  const html = state.mode === "aim" ? screenAim() : state.mode === "quote" ? screenQuote() : screenYard();
  document.getElementById("app").innerHTML = html;
}

document.getElementById("app").addEventListener("click", (e) => {
  const b = e.target.closest("[data-act]");
  if (!b) return;
  const act = b.dataset.act;
  if (act === "front") state.front = b.dataset.id;
  if (act === "pick") state.selected = b.dataset.id;
  if (act === "stamp") {
    const side = state.selected;
    const list = (state.surfaces[side] || []).slice();
    const i = list.indexOf(b.dataset.id);
    if (i >= 0) list.splice(i, 1);
    else list.push(b.dataset.id);
    state.surfaces[side] = list;
  }
  if (act === "cover") state.cover[state.selected] = b.dataset.id;
  if (act === "mode") {
    state.mode = b.dataset.id;
    if (state.mode === "yard" && !state.asked) state.ask = state.ask || 0;
  }
  if (act === "answer") {
    const v = b.dataset.val;
    state[b.dataset.key] = v === "true" ? true : v === "false" ? false : v;
    if (state.ask < ASK.length - 1) state.ask += 1;
    else state.asked = true;
  }
  if (act === "nextq") {
    if (state.ask < ASK.length - 1) state.ask += 1;
    else state.asked = true;
  }
  if (act === "quote") {
    if (!hasAny()) { state.last = "Put something on a wall."; }
    else { state.mode = "quote"; state.last = ""; }
  }
  if (act === "reroll") {
    const key = stripKey(state.selected);
    state.alt[key] = !state.alt[key];
    state.last = state.alt[key] ? "Another legal set for this wall." : "First set for this wall.";
  }
  if (act === "flipchew") {
    state.chew = !state.chew;
    state.last = state.chew ? "Oleander and sago stay off the whole list." : "Chew is off.";
  }
  render();
});

render();
</script>
</body>
</html>
