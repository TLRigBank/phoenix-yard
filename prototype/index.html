<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Phoenix Yard</title>
<style>
  :root {
    --ink: #1c1916;
    --pine: #1B3A2F;
    --sand: #E7DCC8;
    --paper: #FFFBF4;
    --line: #D4CBB8;
    --muted: #5A5348;
    --ember: #C45A28;
    --west: #E8B08A;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; background: var(--sand); color: var(--ink);
    font: 500 16px/1.4 "Avenir Next", "Segoe UI", sans-serif;
  }
  button:focus-visible { outline: 3px solid var(--ember); outline-offset: 2px; }
  #app { max-width: 430px; margin: 0 auto; min-height: 100dvh; background: var(--paper); display: flex; flex-direction: column; }
  header { padding: 14px 18px 0; display: flex; align-items: baseline; gap: 10px; }
  .glyph { width: 22px; height: 22px; flex: none; }
  .brand { font-weight: 750; color: var(--pine); font-size: 17px; }
  .line { margin: 0; color: var(--muted); font-size: 14px; font-weight: 500; }
  main { flex: 1; padding: 8px 18px 12px; }
  h1 { font-size: 24px; font-weight: 650; line-height: 1.2; color: var(--pine); margin: 6px 0 8px; }
  .place { margin: 0 0 8px; color: var(--pine); font-weight: 650; font-size: 15px; }
  .lead { margin: 0 0 10px; color: var(--muted); font-weight: 500; }
  footer { padding: 8px 18px 26px; display: flex; gap: 8px; }
  button.pri, button.ghost, button.ans, button.chip, button.seg {
    border-radius: 12px; min-height: 44px; padding: 10px 12px; font-size: 16px; font-weight: 650; cursor: pointer;
  }
  button.pri { flex: 1; background: var(--pine); color: #fff; border: 0; }
  button.ghost { flex: 1; background: transparent; border: 1px solid var(--line); color: var(--pine); }
  button.ans { flex: 1; background: #fff; border: 1px solid var(--line); color: var(--ink); }
  button.ans.on { background: var(--pine); color: #fff; border-color: var(--pine); }
  .compass { display: flex; gap: 6px; margin: 0 0 8px; }
  .row { display: flex; gap: 6px; flex-wrap: wrap; margin: 0 0 8px; }
  button.chip { flex: 1; min-width: 56px; background: #fff; border: 1px solid var(--line); color: var(--muted); font-size: 14px; }
  button.chip.on { background: var(--pine); color: #fff; border-color: var(--pine); }
  button.seg { flex: 1; background: #fff; border: 1px solid var(--line); color: var(--muted); font-size: 14px; }
  button.seg.on { background: var(--pine); color: #fff; border-color: var(--pine); }
  .icons { display: flex; gap: 6px; margin: 0 0 8px; }
  button.icon {
    flex: 1; min-height: 40px; border-radius: 10px; border: 1px solid var(--line); background: #fff;
    color: var(--muted); font-size: 12px; font-weight: 650; cursor: pointer;
  }
  button.icon.on { border-color: var(--pine); color: var(--pine); background: #E7F0EA; }

  .yard { position: relative; height: 264px; margin: 0 0 10px; background: #E3D6BE; border-radius: 16px; overflow: hidden; border: 1px solid var(--line); }
  .street { position: absolute; left: 0; right: 0; top: 0; height: 28px; background: #6A6660; color: #fff; font-size: 10px; font-weight: 750; letter-spacing: .16em; display: flex; align-items: center; justify-content: space-between; padding: 0 8px; text-transform: uppercase; z-index: 5; }
  .street span { letter-spacing: .16em; }
  .street .hh { display: flex; gap: 4px; text-transform: none; letter-spacing: 0; }
  .street .hh button {
    min-height: 22px; padding: 0 6px; border: 0; border-radius: 6px; background: transparent;
    color: #E8E0D4; font-size: 10px; font-weight: 650; cursor: pointer;
  }
  .street .hh button.on { background: #E8E0D4; color: #3A3630; }
  .pool { margin: 8px 0 0; color: var(--muted); font-size: 13px; font-weight: 500; text-align: center; }
  button.swap {
    width: 100%; margin-top: 8px; min-height: 40px; border-radius: 10px;
    background: transparent; border: 1px solid var(--line); color: var(--pine);
    font-size: 15px; font-weight: 650; cursor: pointer;
  }
  .walk { position: absolute; left: 50%; top: 28px; width: 16px; height: 28px; margin-left: -8px; background: #C9BDA8; z-index: 4; }
  .house {
    position: absolute; left: 50%; top: 54%; width: 96px; height: 78px; margin: -39px 0 0 -48px;
    background: var(--pine); border-radius: 3px; z-index: 4;
  }
  .notch {
    position: absolute; left: 50%; top: -7px; width: 18px; height: 10px; margin-left: -9px;
    background: #C4A574; border-radius: 2px 2px 0 0; z-index: 5;
  }
  .bed {
    position: absolute; border: 2px dashed #B7AD9A; background: rgba(255,251,244,.45);
    color: var(--ink); display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 4px; z-index: 3; cursor: pointer; padding: 4px;
  }
  .bed[data-side="front"] { left: 18%; right: 18%; top: 28px; height: 52px; border-radius: 8px; }
  .bed[data-side="back"] { left: 18%; right: 18%; bottom: 8px; height: 52px; border-radius: 8px; }
  .bed[data-side="left"] { left: 6px; top: 78px; width: 72px; height: 112px; border-radius: 8px; }
  .bed[data-side="right"] { right: 6px; top: 78px; width: 72px; height: 112px; border-radius: 8px; }
  .bed.filled { border-style: solid; background: rgba(255,251,244,.82); }
  .bed.W { background: var(--west); border-color: var(--ember); border-style: solid; color: #6E2E10; }
  .bed.sel { box-shadow: 0 0 0 3px var(--pine); }
  .blabel { font-size: 12px; font-weight: 650; }
  .imarks { display: flex; gap: 4px; align-items: center; }
  .imarks svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 1.8; }
  .more { font-size: 11px; font-weight: 650; }
  .canopy { position: absolute; width: 36px; height: 20px; border-radius: 12px; background: rgba(27,58,47,.38); z-index: 6; pointer-events: none; }
  .canopy.front { left: 50%; top: 34px; margin-left: -18px; }
  .canopy.back { left: 50%; bottom: 12px; margin-left: -18px; }
  .canopy.left { left: 16px; top: 112px; }
  .canopy.right { right: 16px; top: 112px; }
  .blk { position: absolute; background: #7A7266; z-index: 2; pointer-events: none; }
  .blk.front { left: 18%; right: 18%; top: 26px; height: 5px; }
  .blk.back { left: 18%; right: 18%; bottom: 6px; height: 5px; }
  .blk.left { left: 4px; top: 80px; width: 5px; height: 108px; }
  .blk.right { right: 4px; top: 80px; width: 5px; height: 108px; }

  .trio { display: flex; gap: 8px; overflow-x: auto; scroll-snap-type: x mandatory; padding: 0 0 6px; }
  .card { flex: 0 0 78%; scroll-snap-align: start; background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 12px; }
  .swatch { height: 40px; border-radius: 8px; margin: 0 0 8px; }
  .top { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
  .name { font-weight: 750; font-size: 17px; }
  .job { font-size: 12px; font-weight: 650; color: var(--muted); letter-spacing: .04em; text-transform: uppercase; }
  .botanical { margin: 0; font-size: 13px; color: var(--muted); font-style: italic; font-weight: 500; }
  .why { margin: 6px 0 0; font-weight: 500; }
  .mini { display: inline-block; font-size: 12px; font-weight: 650; border-radius: 999px; padding: 3px 8px; background: #E7F0EA; color: var(--pine); margin: 6px 4px 0 0; }
  .mini.warn { background: #F3D0B8; color: #6E2E10; }
</style>
</head>
<body>
<div id="app"></div>
<script>
const FACES = {
  N: { front: "N", back: "S", left: "W", right: "E" },
  S: { front: "S", back: "N", left: "E", right: "W" },
  E: { front: "E", back: "W", left: "N", right: "S" },
  W: { front: "W", back: "E", left: "S", right: "N" }
};
const NAME = { N: "North", S: "South", E: "East", W: "West" };
const PIECES = [
  ["bed", "Bed"],
  ["pots", "Pots"],
  ["gate", "Gate"],
  ["gravel", "Gravel"],
  ["block_wall", "Block"],
  ["shade_tree", "Tree"]
];
const ICONS = {
  bed: '<svg viewBox="0 0 16 16"><rect x="2" y="6" width="12" height="6" rx="1"/></svg>',
  pots: '<svg viewBox="0 0 16 16"><circle cx="5" cy="9" r="2.2"/><circle cx="11" cy="9" r="2.2"/></svg>',
  gate: '<svg viewBox="0 0 16 16"><path d="M3 3v10M13 3v10M3 8h10"/></svg>',
  gravel: '<svg viewBox="0 0 16 16"><path d="M3 11h10M5 8h6M6 5h4"/></svg>',
  block_wall: '<svg viewBox="0 0 16 16"><rect x="2" y="4" width="12" height="8"/></svg>',
  shade_tree: '<svg viewBox="0 0 16 16"><path d="M8 14V8"/><circle cx="8" cy="6" r="4"/></svg>',
  tree: '<svg viewBox="0 0 16 16"><circle cx="8" cy="7" r="4"/></svg>'
};
const DEMO = {
  W: {
    bed: [
      { name: "Red Yucca", botanical: "Hesperaloe parviflora", job: "Bone", color: "#9E2B2B", why: "Holds the west wall.", chip: "Almost no extra water" },
      { name: "Parry’s Penstemon", botanical: "Penstemon parryi", job: "Bloom", color: "#C46B8A", why: "Flower on the west wall.", chip: "Almost no extra water" },
      { name: "Native Hedgehog", botanical: "Echinocereus engelmannii", job: "Floor", color: "#C46B8A", why: "Low on the west wall.", chip: "Spines", warn: true }
    ],
    pots: [
      { name: "Texas Tuberose", botanical: "Manfreda maculosa", job: "Bone", color: "#C46B8A", why: "Fits a pot on the west patio.", chip: "Fits a pot" },
      { name: "Desert Marigold", botanical: "Baileya multiradiata", job: "Bloom", color: "#C8960A", why: "Flower in a west pot.", chip: "Fits a pot" },
      { name: "Beavertail", botanical: "Opuntia basilaris", job: "Floor", color: "#C46B8A", why: "Low pot. Keep it off the path.", chip: "Spines", warn: true }
    ],
    shade_tree: [
      { name: "Desert Museum Palo Verde", botanical: "Cercidium 'Desert Museum'", job: "Bone", color: "#C8960A", why: "Canopy for the west side. Almost no extra water.", chip: "Needs room from the house" },
      { name: "Desert Willow", botanical: "Chilopsis linearis", job: "Bloom", color: "#C46B8A", why: "Flowering tree for the west side.", chip: "Almost no extra water" },
      { name: "Foothill Palo Verde", botanical: "Parkinsonia microphylla", job: "Floor", color: "#8AA0B4", why: "Smaller native tree. Grows here already.", chip: "Grows here already" }
    ]
  },
  N: {
    bed: [
      { name: "Beargrass", botanical: "Nolina microcarpa", job: "Bone", color: "#8AA0B4", why: "Takes the north frost pocket.", chip: "North shade" },
      { name: "Autumn Sage", botanical: "Salvia greggii", job: "Bloom", color: "#9E2B2B", why: "Flower in north shade.", chip: "North shade" },
      { name: "Trailing Indigo", botanical: "Dalea greggii", job: "Floor", color: "#6B4F8A", why: "Low cover on the north side.", chip: "Feeds the soil" }
    ]
  },
  E: {
    bed: [
      { name: "Desert Honeysuckle", botanical: "Anisacanthus thurberi", job: "Bone", color: "#D4652F", why: "Morning sun, house shade after noon.", chip: "East wall" },
      { name: "Damianita", botanical: "Chrysactinia mexicana", job: "Bloom", color: "#C8960A", why: "Low flower for the east wall.", chip: "East wall" },
      { name: "Texas Tuberose", botanical: "Manfreda maculosa", job: "Floor", color: "#C46B8A", why: "Fits the east edge.", chip: "Almost no extra water" }
    ]
  },
  S: {
    bed: [
      { name: "Banana Yucca", botanical: "Yucca baccata", job: "Bone", color: "#8AA0B4", why: "Long south sun.", chip: "South wall" },
      { name: "Flame Honeysuckle", botanical: "Anisacanthus quadrifidus", job: "Bloom", color: "#D4652F", why: "Flower for the south wall.", chip: "Almost no extra water" },
      { name: "Beavertail", botanical: "Opuntia basilaris", job: "Floor", color: "#C46B8A", why: "Low on the south gravel.", chip: "Spines", warn: true }
    ]
  }
};

const SWAP = {
  A: { name: "Banana Yucca", botanical: "Yucca baccata", job: "Bone", color: "#8AA0B4", why: "Another blade for this wall.", chip: "Almost no extra water", seat: "A", can_swap: true },
  B: { name: "Autumn Sage", botanical: "Salvia greggii", job: "Bloom", color: "#9E2B2B", why: "Another flower for this wall.", chip: "Almost no extra water", seat: "B", can_swap: true },
  C: { name: "Trailing Indigo", botanical: "Dalea greggii", job: "Floor", color: "#6B4F8A", why: "Another low plant for this wall.", chip: "Feeds the soil", seat: "C", can_swap: true }
};
const state = {
  mode: "aim",
  front: "N",
  selected: "front",
  piece: "bed",
  surfaces: { front: [], left: [], right: [], back: [] },
  cover: { front: "none", left: "none", right: "none", back: "none" },
  kids: false, chew: false, wildlife: true, care: "Low",
  alt: false,
  swaps: {},
  last: ""
};

function faces() { return FACES[state.front]; }
function bearing(side) { return faces()[side]; }
function westSide() { return Object.keys(faces()).find((s) => faces()[s] === "W"); }
function list(side) { return state.surfaces[side] || []; }
function hasAny() { return ["front", "left", "right", "back"].some((s) => list(s).length); }
function placeLine() {
  const w = westSide();
  if (state.front === "W") return "Front faces west · the front wall cooks";
  return "Front faces " + NAME[state.front].toLowerCase() + " · west is the " + w + " wall";
}

function glyph() {
  return `<svg class="glyph" viewBox="0 0 22 22" aria-hidden="true">
    <rect x="1" y="1" width="20" height="20" rx="3" fill="#E7DCC8" stroke="#1B3A2F" stroke-width="1.4"/>
    <rect x="7" y="7" width="8" height="8" fill="#1B3A2F"/>
    <rect x="7" y="3" width="8" height="3" fill="#C45A28"/>
  </svg>`;
}

function markSvgs(side) {
  const items = list(side).slice();
  if (state.cover[side] === "tree") items.push("tree");
  const show = items.slice(0, 2);
  const extra = items.length - show.length;
  return `<span class="imarks">${show.map((k) => ICONS[k] || "").join("")}${extra > 0 ? `<span class="more">+${extra}</span>` : ""}</span>`;
}

function yard() {
  const beds = ["front", "left", "right", "back"].map((side) => {
    const b = bearing(side);
    const filled = list(side).length > 0;
    const label = side === "front" ? "Front · " + NAME[b] : NAME[b];
    return `<button class="bed ${b} ${filled ? "filled" : ""} ${state.selected === side ? "sel" : ""}" data-act="pick" data-id="${side}">
      <span class="blabel">${label}</span>${markSvgs(side)}
    </button>`;
  }).join("");
  const trees = ["front", "left", "right", "back"].filter((s) => state.cover[s] === "tree").map((s) => `<div class="canopy ${s}"></div>`).join("");
  const blocks = ["front", "left", "right", "back"].filter((s) => list(s).includes("block_wall")).map((s) => `<div class="blk ${s}"></div>`).join("");
  return `<div class="yard">
    <div class="street"><span>Street</span>${state.mode === "aim" ? "" : householdBar()}</div>
    <div class="walk"></div>
    ${blocks}${beds}${trees}
    <div class="house"><span class="notch" title="Front door"></span></div>
  </div>`;
}

function householdBar() {
  return `<div class="hh">
    <button type="button" class="${state.kids ? "on" : ""}" data-act="tog" data-id="kids">Kids</button>
    <button type="button" class="${state.chew ? "on" : ""}" data-act="tog" data-id="chew">Chew</button>
    <button type="button" class="${state.wildlife ? "on" : ""}" data-act="tog" data-id="wildlife">Wild</button>
    <button type="button" class="${state.care !== "Low" ? "on" : ""}" data-act="care">${state.care === "Low" ? "Low" : state.care === "Weekend" ? "Wknd" : "Hobby"}</button>
  </div>`;
}

function household() { return ""; }

function tray() {
  const side = state.selected;
  const on = list(side);
  const pcs = PIECES.map(([id, label]) =>
    `<button class="chip ${on.includes(id) ? "on" : ""}" data-act="stamp" data-id="${id}">${label}</button>`
  ).join("");
  const cvs = [["none", "Open"], ["tree", "Tree"], ["eave", "Eave"], ["structure", "Cover"]].map(([id, label]) =>
    `<button class="chip ${state.cover[side] === id ? "on" : ""}" data-act="cover" data-id="${id}">${label}</button>`
  ).join("");
  return `<div class="row">${pcs}</div><div class="row">${cvs}</div>`;
}

function segs() {
  const on = list(state.selected);
  if (on.length <= 1) return "";
  return `<div class="row">${on.map((id) =>
    `<button class="seg ${state.piece === id ? "on" : ""}" data-act="piece" data-id="${id}">${id === "block_wall" ? "Block" : id}</button>`
  ).join("")}</div>`;
}

function pack() {
  const b = bearing(state.selected);
  const piece = list(state.selected).includes(state.piece) ? state.piece : (list(state.selected)[0] || "bed");
  const byB = DEMO[b] || DEMO.W;
  let rows = (byB[piece] || byB.bed || DEMO.W.bed).map((c, i) => ({ ...c, seat: ["A", "B", "C"][i], can_swap: true }));
  const swaps = state.swaps[quoteKey()] || {};
  return rows.map((c) => (swaps[c.seat] ? { ...c, ...swaps[c.seat], swapped: true } : c));
}

function quoteKey() {
  const piece = list(state.selected).includes(state.piece) ? state.piece : (list(state.selected)[0] || "bed");
  return state.selected + ":" + piece + (state.alt ? ":alt" : "");
}

function cards() {
  const rows = pack();
  const more = state.alt ? 6 : 12;
  return `<div class="trio">${rows.map((c) => `<article class="card">
    <div class="swatch" style="background:${c.color}"></div>
    <div class="top"><span class="name">${c.name}</span><span class="job">${c.job}</span></div>
    <p class="botanical">${c.botanical}</p>
    <p class="why">${c.why}</p>
    <span class="mini ${c.warn ? "warn" : ""}">${c.chip}</span>
    ${c.can_swap ? `<button class="swap" data-act="swap" data-id="${c.seat}">Swap ${c.job}</button>` : ""}
  </article>`).join("")}</div>
  <p class="pool">${more} more for this wall</p>`;
}

function screenAim() {
  return `<header>${glyph()}<span class="brand">Phoenix Yard</span></header>
    <main>
      <p class="line">Plants that match the wall.</p>
      <h1>Which way does the front face?</h1>
      <p class="lead">Street is the top. The notch is the front door. West warms itself.</p>
      ${yard()}
      <div class="compass">
        ${["N", "S", "E", "W"].map((id) =>
          `<button class="ans ${state.front === id ? "on" : ""}" data-act="front" data-id="${id}">${NAME[id]}</button>`
        ).join("")}
      </div>
    </main>
    <footer><button class="pri" data-act="mode" data-id="yard">That’s the front</button></footer>`;
}

function screenYard() {
  return `<header>${glyph()}<span class="brand">Phoenix Yard</span></header>
    <main>
      <p class="place">${placeLine()}</p>
      ${yard()}
      ${tray()}
      ${state.last ? `<p class="lead">${state.last}</p>` : ""}
    </main>
    <footer>
      <button class="ghost" data-act="mode" data-id="aim">Aim</button>
      <button class="pri" data-act="quote">See the plants</button>
    </footer>`;
}

function screenQuote() {
  const piece = list(state.selected).includes(state.piece) ? state.piece : (list(state.selected)[0] || "bed");
  const label = piece === "block_wall" ? "block wall" : piece === "shade_tree" ? "tree" : piece;
  return `<header>${glyph()}<span class="brand">Phoenix Yard</span></header>
    <main>
      <p class="place">${NAME[bearing(state.selected)]} · ${label}</p>
      ${yard()}
      ${segs()}
      ${state.last ? `<p class="lead">${state.last}</p>` : ""}
      ${list(state.selected).length ? cards() : `<p class="lead">Put something on a wall.</p>`}
    </main>
    <footer>
      <button class="ghost" data-act="mode" data-id="yard">Map</button>
      <button class="pri" data-act="reroll">Three others for this wall</button>
    </footer>`;
}

function render() {
  const html = state.mode === "aim" ? screenAim() : state.mode === "quote" ? screenQuote() : screenYard();
  document.getElementById("app").innerHTML = html;
}

document.getElementById("app").addEventListener("click", (e) => {
  const b = e.target.closest("[data-act]");
  if (!b) return;
  const act = b.dataset.act;
  if (act === "front") state.front = b.dataset.id;
  if (act === "pick") {
    state.selected = b.dataset.id;
    const on = list(state.selected);
    if (on.length && !on.includes(state.piece)) state.piece = on[0];
    state.last = state.mode === "quote" && !on.length ? "Put something on a wall." : "";
  }
  if (act === "mode") {
    const from = state.mode;
    state.mode = b.dataset.id;
    state.last = "";
    if (from === "aim" && b.dataset.id === "yard") state.selected = westSide() || state.selected;
  }
  if (act === "stamp") {
    const side = state.selected;
    const next = list(side).slice();
    const i = next.indexOf(b.dataset.id);
    if (i >= 0) next.splice(i, 1);
    else next.push(b.dataset.id);
    state.surfaces[side] = next;
    state.piece = b.dataset.id;
    state.last = "";
  }
  if (act === "cover") state.cover[state.selected] = b.dataset.id;
  if (act === "piece") state.piece = b.dataset.id;
  if (act === "tog") state[b.dataset.id] = !state[b.dataset.id];
  if (act === "care") state.care = state.care === "Low" ? "Weekend" : state.care === "Weekend" ? "Hobby" : "Low";
  if (act === "quote") {
    if (!hasAny()) state.last = "Put something on a wall.";
    else { state.mode = "quote"; state.last = ""; }
  }
  if (act === "reroll") {
    state.alt = !state.alt;
    state.swaps[quoteKey()] = {};
    state.last = state.alt ? "Another legal set for this wall." : "Back to this wall’s first set.";
  }
  if (act === "swap") {
    const key = quoteKey();
    const cur = Object.assign({}, state.swaps[key] || {});
    if (cur[b.dataset.id]) delete cur[b.dataset.id];
    else cur[b.dataset.id] = SWAP[b.dataset.id];
    state.swaps[key] = cur;
    state.last = "Swapped one plant. The other two stayed.";
  }
  render();
});

render();
</script>
</body>
</html>
