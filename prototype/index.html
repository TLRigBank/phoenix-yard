<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Phoenix Yard</title>
<style>
  :root {
    --paper: #121A17;
    --sand: #1C2621;
    --ink: #E8E0D4;
    --pine: #9FBFB0;
    --pine-fill: #2A4A3C;
    --house: #0F3A2C;
    --muted: #A39888;
    --line: #3A4640;
    --ember: #E07A45;
    --west: #5A3220;
    --warn-bg: #5A3220;
    --warn-ink: #F3D0B8;
    --chip-bg: #1B3A2F;
    --chip-ink: #C5D9CF;
    --street: #0E1411;
    --notch: #C4A574;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; background: #0E1411; color: var(--ink);
    font: 500 16px/1.4 "Avenir Next", "Segoe UI", sans-serif;
  }
  button:focus-visible { outline: 3px solid var(--ember); outline-offset: 2px; }
  #app { max-width: 430px; margin: 0 auto; min-height: 100dvh; background: var(--paper); display: flex; flex-direction: column; position: relative; }
  header { padding: 14px 18px 0; display: flex; align-items: baseline; gap: 10px; }
  .glyph { width: 22px; height: 22px; flex: none; }
  .brand { font-weight: 750; color: var(--pine); font-size: 17px; }
  .line { margin: 0; color: var(--muted); font-size: 14px; font-weight: 500; }
  main { flex: 1; padding: 8px 18px 12px; }
  h1 { font-size: 24px; font-weight: 650; line-height: 1.2; color: var(--pine); margin: 6px 0 8px; }
  .place { margin: 0 0 8px; color: var(--pine); font-weight: 650; font-size: 15px; }
  .lead { margin: 0 0 10px; color: var(--muted); font-weight: 500; }
  .hint { margin: 0 0 8px; color: var(--muted); font-size: 13px; font-weight: 500; }
  .status { margin: 0 0 8px; color: var(--muted); font-size: 13px; font-weight: 650; }
  footer { padding: 8px 18px 26px; display: flex; gap: 8px; }
  button.pri, button.ghost, button.ans, button.chip, button.seg, button.icon, button.swap {
    border-radius: 12px; min-height: 44px; padding: 10px 12px; font-size: 16px; font-weight: 650; cursor: pointer;
    background: var(--sand); color: var(--ink); border: 2px solid var(--line);
  }
  button.pri { flex: 1; background: var(--pine-fill); border-color: var(--pine); }
  button.pri[disabled] { opacity: .4; cursor: not-allowed; }
  button.ghost { flex: 1; color: var(--pine); }
  button.quiet { background: none; border: 0; color: var(--muted); font-size: 13px; font-weight: 650; min-height: 36px; padding: 0; cursor: pointer; }
  button.ans.on, button.chip.on, button.seg.on, button.icon.on {
    background: var(--pine-fill); color: var(--ink); border-color: var(--pine);
  }
  .compass { display: flex; gap: 6px; margin: 0 0 8px; }
  .row { display: flex; gap: 6px; flex-wrap: wrap; margin: 0 0 8px; }
  button.chip { flex: 1; min-width: 56px; font-size: 14px; }
  button.seg { flex: 1; font-size: 14px; }
  .icons { display: flex; gap: 6px; margin: 0 0 10px; }
  button.icon { flex: 1; font-size: 13px; border-radius: 10px; }
  button[data-hold] { -webkit-touch-callout: none; user-select: none; touch-action: manipulation; }

  .yard { position: relative; height: 264px; margin: 0 0 10px; background: #161E1B; border-radius: 16px; overflow: hidden; border: 1px solid var(--line); }
  .yard.compact { height: 176px; }
  .street { position: absolute; left: 0; right: 0; top: 0; height: 28px; background: var(--street); color: #C5D9CF; font-size: 10px; font-weight: 750; letter-spacing: .16em; display: flex; align-items: center; justify-content: center; text-transform: uppercase; z-index: 5; }
  .yard.compact .street { height: 22px; }
  button.swap { width: 100%; margin-top: 10px; }
  .walk { position: absolute; left: 50%; top: 28px; width: 18px; height: 32px; margin-left: -9px; background: #3A4640; z-index: 4; }
  .yard.compact .walk { top: 22px; height: 20px; }
  .house {
    position: absolute; left: 50%; top: 54%; width: 96px; height: 78px; margin: -39px 0 0 -48px;
    background: var(--house); border-radius: 3px; z-index: 4;
  }
  .yard.compact .house { width: 72px; height: 54px; margin: -27px 0 0 -36px; }
  .notch {
    position: absolute; left: 50%; top: -10px; width: 22px; height: 14px; margin-left: -11px;
    background: var(--notch); border-radius: 3px 3px 0 0; z-index: 5;
  }
  .bed {
    position: absolute; border: 2px dashed #3A4640; background: transparent;
    color: var(--ink); display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 4px; z-index: 3; cursor: pointer; padding: 4px;
  }
  .bed[data-side="front"] { left: 18%; right: 18%; top: 28px; height: 52px; border-radius: 8px; }
  .bed[data-side="back"] { left: 18%; right: 18%; bottom: 8px; height: 52px; border-radius: 8px; }
  .bed[data-side="left"] { left: 6px; top: 78px; width: 72px; height: 112px; border-radius: 8px; }
  .bed[data-side="right"] { right: 6px; top: 78px; width: 72px; height: 112px; border-radius: 8px; }
  .yard.compact .bed[data-side="front"] { top: 22px; height: 34px; }
  .yard.compact .bed[data-side="back"] { bottom: 6px; height: 34px; }
  .yard.compact .bed[data-side="left"] { top: 54px; width: 54px; height: 78px; }
  .yard.compact .bed[data-side="right"] { top: 54px; width: 54px; height: 78px; }
  .bed.filled { border-style: solid; border-color: var(--line); }
  .bed.W { background: var(--west); border-color: transparent; }
  .bed.W.filled { border-color: var(--line); border-style: solid; }
  .bed.sel { box-shadow: 0 0 0 3px var(--pine); }
  .blabel { font-size: 12px; font-weight: 650; }
  .imarks { display: flex; gap: 4px; align-items: center; }
  .imarks svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.8; }
  .more { font-size: 11px; font-weight: 650; }
  .canopy { position: absolute; width: 36px; height: 20px; border-radius: 12px; background: rgba(159,191,176,.28); z-index: 6; pointer-events: none; }
  .canopy.front { left: 50%; top: 34px; margin-left: -18px; }
  .canopy.back { left: 50%; bottom: 12px; margin-left: -18px; }
  .canopy.left { left: 16px; top: 112px; }
  .canopy.right { right: 16px; top: 112px; }
  .yard.compact .canopy.front { top: 24px; }
  .yard.compact .canopy.left { top: 72px; left: 10px; }
  .yard.compact .canopy.right { top: 72px; right: 10px; }
  .blk { position: absolute; background: #5A5348; z-index: 2; pointer-events: none; }
  .blk.front { left: 18%; right: 18%; top: 26px; height: 5px; }
  .blk.back { left: 18%; right: 18%; bottom: 6px; height: 5px; }
  .blk.left { left: 4px; top: 80px; width: 5px; height: 108px; }
  .blk.right { right: 4px; top: 80px; width: 5px; height: 108px; }

  .strip { display: flex; gap: 8px; margin: 4px 0 0; }
  .tile {
    flex: 1; min-width: 0; padding: 0 0 8px; overflow: hidden; text-align: left;
    background: var(--sand); border: 2px solid var(--line); border-radius: 12px; color: var(--ink);
    cursor: pointer;
  }
  .tile.on { border-color: var(--pine); }
  .tile img, .tile .ph {
    display: block; width: 100%; height: 88px; object-fit: cover; background: #161E1B;
  }
  .tile .job, .sheet .job { display: block; font-size: 10px; font-weight: 650; color: var(--muted); letter-spacing: .04em; text-transform: uppercase; margin: 6px 8px 0; }
  .tile .name { font-weight: 750; font-size: 13px; line-height: 1.25; margin: 2px 8px 0; }
  .tile .mark { display: inline-block; margin: 4px 8px 0; font-size: 11px; font-weight: 650; border-radius: 999px; padding: 2px 7px; background: var(--warn-bg); color: var(--warn-ink); }

  .sheet {
    position: fixed; left: 50%; bottom: 0; width: min(430px, 100%); margin-left: calc(min(430px, 100%) / -2);
    background: var(--sand); border: 2px solid var(--pine); border-bottom: 0; border-radius: 16px 16px 0 0;
    padding: 8px 16px 28px; z-index: 20; max-height: 62dvh; overflow: auto;
  }
  .grab { width: 36px; height: 4px; border-radius: 4px; background: var(--line); margin: 4px auto 10px; }
  .sheet img, .sheet .ph { width: 100%; height: 160px; object-fit: cover; border-radius: 10px; background: #161E1B; display: block; }
  .sheet .name { font-weight: 750; font-size: 20px; margin: 2px 8px 0; }
  .botanical { margin: 0 8px; font-size: 13px; color: var(--muted); font-style: italic; font-weight: 500; }
  .meta { margin: 4px 8px 0; font-size: 13px; color: var(--muted); font-weight: 650; }
  .why { margin: 8px 8px 0; font-weight: 500; }
  .mini { display: inline-block; font-size: 12px; font-weight: 650; border-radius: 999px; padding: 3px 8px; background: var(--chip-bg); color: var(--chip-ink); margin: 8px 4px 0 8px; }
  .mini.warn { background: var(--warn-bg); color: var(--warn-ink); }

  #hold-card {
    position: fixed; z-index: 30; display: none; max-width: 240px;
    background: var(--sand); color: var(--ink); border: 2px solid var(--pine);
    border-radius: 10px; padding: 8px 10px; font-size: 13px; font-weight: 500; line-height: 1.3;
    pointer-events: none;
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="hold-card" hidden></div>
<script>
const FACES = {
  N: { front: "N", back: "S", left: "W", right: "E" },
  S: { front: "S", back: "N", left: "E", right: "W" },
  E: { front: "E", back: "W", left: "N", right: "S" },
  W: { front: "W", back: "E", left: "S", right: "N" }
};
const NAME = { N: "North", S: "South", E: "East", W: "West" };
const PIECES = [
  ["bed", "Bed"],
  ["pots", "Pots"],
  ["gate", "Gate"],
  ["gravel", "Gravel"],
  ["block_wall", "Block"],
  ["shade_tree", "Tree"]
];
const HOLD = {
  bed: "Plants in the ground on this wall.",
  pots: "Plants that fit a container on this wall.",
  gate: "The walk opening. Keep spines off the path.",
  gravel: "Open ground. Low plants only.",
  block_wall: "Masonry that throws heat.",
  shade_tree: "Plant a shade tree on this wall.",
  none: "No shade on this wall yet.",
  tree: "Shade already there. Not a new tree.",
  eave: "Roof shade on this wall.",
  structure: "Shade from a patio or wall.",
  chew: "Dogs or kids that mouth plants.",
  kids: "Hands and mouths at plant height.",
  wildlife: "Birds and pollinators on this yard.",
  bone: "The structure plant on this wall.",
  bloom: "The flower on this wall.",
  floor: "The low plant on this wall.",
  "swap-A": "Keep Bloom and Floor. Replace only the structure plant.",
  "swap-B": "Keep Bone and Floor. Replace only the flower.",
  "swap-C": "Keep Bone and Bloom. Replace only the low plant."
};
const ICONS = {
  bed: '<svg viewBox="0 0 16 16"><rect x="2" y="6" width="12" height="6" rx="1"/></svg>',
  pots: '<svg viewBox="0 0 16 16"><circle cx="5" cy="9" r="2.2"/><circle cx="11" cy="9" r="2.2"/></svg>',
  gate: '<svg viewBox="0 0 16 16"><path d="M3 3v10M13 3v10M3 8h10"/></svg>',
  gravel: '<svg viewBox="0 0 16 16"><path d="M3 11h10M5 8h6M6 5h4"/></svg>',
  block_wall: '<svg viewBox="0 0 16 16"><rect x="2" y="4" width="12" height="8"/></svg>',
  shade_tree: '<svg viewBox="0 0 16 16"><path d="M8 14V8"/><circle cx="8" cy="6" r="4"/></svg>',
  tree: '<svg viewBox="0 0 16 16"><circle cx="8" cy="7" r="4"/></svg>'
};
const DEMO = {
  W: {
    bed: [
      { name: "Red Yucca", botanical: "Hesperaloe parviflora", job: "Bone", color: "#9E2B2B", why: "Holds the west wall.", chip: "Almost no extra water", photo: "../photos/CCF-YUCC-010.webp", meta: "Sword · 3–5 ft" },
      { name: "Parry’s Penstemon", botanical: "Penstemon parryi", job: "Bloom", color: "#C46B8A", why: "Flower on the west wall.", chip: "Almost no extra water", photo: "../photos/CCF-PERN-039.webp", meta: "Spike · 2–3 ft" },
      { name: "Beavertail", botanical: "Opuntia basilaris", job: "Floor", color: "#C46B8A", why: "Low on the west wall.", chip: "Spines", warn: true, photo: "../photos/CCF-CACT-055.webp", meta: "Pad · 1 ft" }
    ],
    pots: [
      { name: "Texas Tuberose", botanical: "Manfreda maculosa", job: "Bone", color: "#C46B8A", why: "Fits a pot on the west patio.", chip: "Fits a pot", photo: "../photos/CCF-OSUC-034.webp", meta: "Rosette · 1–2 ft" },
      { name: "Desert Marigold", botanical: "Baileya multiradiata", job: "Bloom", color: "#C8960A", why: "Flower in a west pot.", chip: "Fits a pot", photo: "../photos/CCF-PERN-007.webp", meta: "Mound · 1 ft" },
      { name: "Beavertail", botanical: "Opuntia basilaris", job: "Floor", color: "#C46B8A", why: "Low pot. Keep it off the path.", chip: "Spines", warn: true, photo: "../photos/CCF-CACT-055.webp", meta: "Pad · 1 ft" }
    ],
    shade_tree: [
      { name: "Desert Museum Palo Verde", botanical: "Cercidium 'Desert Museum'", job: "Bone", color: "#C8960A", why: "Canopy for the west side. Almost no extra water.", chip: "Needs room from the house", photo: "../photos/CCF-DTRE-010.webp", meta: "Canopy · 20–25 ft" },
      { name: "Desert Willow", botanical: "Chilopsis linearis", job: "Bloom", color: "#C46B8A", why: "Flowering tree for the west side.", chip: "Almost no extra water", photo: "../photos/CCF-DTRE-017.webp", meta: "Canopy · 15–25 ft" },
      { name: "Foothill Palo Verde", botanical: "Parkinsonia microphylla", job: "Floor", color: "#8AA0B4", why: "Smaller native tree. Grows here already.", chip: "Grows here already", photo: "../photos/CCF-DTRE-012.webp", meta: "Canopy · 15–20 ft" }
    ]
  },
  N: {
    bed: [
      { name: "Banana Yucca", botanical: "Yucca baccata", job: "Bone", color: "#8AA0B4", why: "Takes the north frost pocket.", chip: "North shade", photo: "../photos/CCF-YUCC-014.webp", meta: "Blade · 3–4 ft" },
      { name: "Autumn Sage", botanical: "Salvia greggii", job: "Bloom", color: "#9E2B2B", why: "Flower in north shade.", chip: "North shade", photo: "../photos/CCF-PERN-054.webp", meta: "Shrub · 2–3 ft" },
      { name: "Trailing Indigo", botanical: "Dalea greggii", job: "Floor", color: "#6B4F8A", why: "Low cover on the north side.", chip: "Feeds the soil", photo: "../photos/CCF-PERN-016.webp", meta: "Mat · 1 ft" }
    ]
  },
  E: {
    bed: [
      { name: "Desert Honeysuckle", botanical: "Anisacanthus thurberi", job: "Bone", color: "#D4652F", why: "Morning sun, house shade after noon.", chip: "East wall", photo: "../photos/CCF-FSHB-003.webp", meta: "Cane · 3–5 ft" },
      { name: "Damianita", botanical: "Chrysactinia mexicana", job: "Bloom", color: "#C8960A", why: "Low flower for the east wall.", chip: "East wall", photo: "../photos/CCF-PERN-011.webp", meta: "Mound · 1–2 ft" },
      { name: "Texas Tuberose", botanical: "Manfreda maculosa", job: "Floor", color: "#C46B8A", why: "Fits the east edge.", chip: "Almost no extra water", photo: "../photos/CCF-OSUC-034.webp", meta: "Rosette · 1–2 ft" }
    ]
  },
  S: {
    bed: [
      { name: "Banana Yucca", botanical: "Yucca baccata", job: "Bone", color: "#8AA0B4", why: "Long south sun.", chip: "South wall", photo: "../photos/CCF-YUCC-014.webp", meta: "Blade · 3–4 ft" },
      { name: "Flame Honeysuckle", botanical: "Anisacanthus quadrifidus", job: "Bloom", color: "#D4652F", why: "Flower for the south wall.", chip: "Almost no extra water", photo: "../photos/CCF-FSHB-002.webp", meta: "Cane · 3–5 ft" },
      { name: "Beavertail", botanical: "Opuntia basilaris", job: "Floor", color: "#C46B8A", why: "Low on the south gravel.", chip: "Spines", warn: true, photo: "../photos/CCF-CACT-055.webp", meta: "Pad · 1 ft" }
    ]
  }
};

const SWAP = {
  A: { name: "Banana Yucca", botanical: "Yucca baccata", job: "Bone", color: "#8AA0B4", why: "Another blade for this wall.", chip: "Almost no extra water", seat: "A", can_swap: true, photo: "../photos/CCF-YUCC-014.webp", meta: "Blade · 3–4 ft" },
  B: { name: "Autumn Sage", botanical: "Salvia greggii", job: "Bloom", color: "#9E2B2B", why: "Another flower for this wall.", chip: "Almost no extra water", seat: "B", can_swap: true, photo: "../photos/CCF-PERN-054.webp", meta: "Shrub · 2–3 ft" },
  C: { name: "Trailing Indigo", botanical: "Dalea greggii", job: "Floor", color: "#6B4F8A", why: "Another low plant for this wall.", chip: "Feeds the soil", seat: "C", can_swap: true, photo: "../photos/CCF-PERN-016.webp", meta: "Mat · 1 ft" }
};
const state = {
  mode: "aim",
  front: "N",
  selected: "front",
  piece: "bed",
  surfaces: { front: [], left: [], right: [], back: [] },
  cover: { front: "none", left: "none", right: "none", back: "none" },
  kids: false, chew: false, wildlife: true, care: "Low",
  alt: false,
  swaps: {},
  last: "",
  sheet: null,
  sawHold: false
};

function faces() { return FACES[state.front]; }
function bearing(side) { return faces()[side]; }
function westSide() { return Object.keys(faces()).find((s) => faces()[s] === "W"); }
function list(side) { return state.surfaces[side] || []; }
function hasAny() { return ["front", "left", "right", "back"].some((s) => list(s).length); }
function placeLine() {
  const w = westSide();
  if (state.front === "W") return "Front faces west · the front wall cooks";
  return "Front faces " + NAME[state.front].toLowerCase() + " · west is the " + w + " wall";
}

function glyph() {
  return `<svg class="glyph" viewBox="0 0 22 22" aria-hidden="true">
    <rect x="1" y="1" width="20" height="20" rx="3" fill="#1C2621" stroke="#9FBFB0" stroke-width="1.4"/>
    <rect x="7" y="7" width="8" height="8" fill="#0F3A2C"/>
    <rect x="7" y="3" width="8" height="3" fill="#C45A28"/>
  </svg>`;
}

function markSvgs(side) {
  const items = list(side).slice();
  if (state.cover[side] === "tree") items.push("tree");
  const show = items.slice(0, 2);
  const extra = items.length - show.length;
  return `<span class="imarks">${show.map((k) => ICONS[k] || "").join("")}${extra > 0 ? `<span class="more">+${extra}</span>` : ""}</span>`;
}

function yard() {
  const compact = state.mode === "quote" ? " compact" : "";
  const beds = ["front", "left", "right", "back"].map((side) => {
    const b = bearing(side);
    const filled = list(side).length > 0;
    const label = side === "front" ? "Front · " + NAME[b] : NAME[b];
    return `<button class="bed ${b} ${filled ? "filled" : ""} ${state.selected === side ? "sel" : ""}" data-act="pick" data-id="${side}">
      <span class="blabel">${label}</span>${markSvgs(side)}
    </button>`;
  }).join("");
  const trees = ["front", "left", "right", "back"].filter((s) => state.cover[s] === "tree").map((s) => `<div class="canopy ${s}"></div>`).join("");
  const blocks = ["front", "left", "right", "back"].filter((s) => list(s).includes("block_wall")).map((s) => `<div class="blk ${s}"></div>`).join("");
  return `<div class="yard${compact}">
    <div class="street">Street</div>
    <div class="walk"></div>
    ${blocks}${beds}${trees}
    <div class="house"><span class="notch" title="Front door"></span></div>
  </div>`;
}

function householdBar() {
  if (state.mode !== "yard") return "";
  return `<div class="icons">
    <button type="button" class="icon ${state.kids ? "on" : ""}" data-act="tog" data-id="kids" data-hold="kids" aria-describedby="hold-card">${"Kids"}</button>
    <button type="button" class="icon ${state.chew ? "on" : ""}" data-act="tog" data-id="chew" data-hold="chew" aria-describedby="hold-card">Chew</button>
    <button type="button" class="icon ${state.wildlife ? "on" : ""}" data-act="tog" data-id="wildlife" data-hold="wildlife" aria-describedby="hold-card">Wild</button>
    <button type="button" class="icon ${state.care !== "Low" ? "on" : ""}" data-act="care">${state.care === "Low" ? "Time: low" : state.care === "Weekend" ? "Weekends" : "Hobby"}</button>
  </div>`;
}

function householdStatus() {
  if (state.mode !== "quote") return "";
  const bits = [];
  if (state.kids) bits.push("Kids");
  if (state.chew) bits.push("Chew");
  if (state.care !== "Low") bits.push(state.care === "Weekend" ? "Weekends" : "Hobby");
  if (!bits.length) return "";
  return `<p class="status">${bits.join(" · ")}</p>`;
}

function tray() {
  const side = state.selected;
  const on = list(side);
  const pcs = PIECES.map(([id, label]) =>
    `<button class="chip ${on.includes(id) ? "on" : ""}" data-act="stamp" data-id="${id}" data-hold="${id}" aria-describedby="hold-card">${label}</button>`
  ).join("");
  const cvs = [["none", "Open"], ["tree", "Canopy"], ["eave", "Eave"], ["structure", "Structure"]].map(([id, label]) =>
    `<button class="chip ${state.cover[side] === id ? "on" : ""}" data-act="cover" data-id="${id}" data-hold="${id}" aria-describedby="hold-card">${label}</button>`
  ).join("");
  const coach = state.sawHold ? "" : `<p class="hint">Hold a word for a line.</p>`;
  return `${coach}<div class="row">${pcs}</div><div class="row">${cvs}</div>`;
}

function segs() {
  const on = list(state.selected);
  if (on.length <= 1) return "";
  return `<div class="row">${on.map((id) =>
    `<button class="seg ${state.piece === id ? "on" : ""}" data-act="piece" data-id="${id}" data-hold="${id}" aria-describedby="hold-card">${id === "block_wall" ? "Block" : id === "shade_tree" ? "Tree" : id[0].toUpperCase() + id.slice(1)}</button>`
  ).join("")}</div>`;
}

function pack() {
  const b = bearing(state.selected);
  const piece = list(state.selected).includes(state.piece) ? state.piece : (list(state.selected)[0] || "bed");
  const byB = DEMO[b] || DEMO.W;
  let rows = (byB[piece] || byB.bed || DEMO.W.bed).map((c, i) => ({ ...c, seat: ["A", "B", "C"][i], can_swap: true }));
  const swaps = state.swaps[quoteKey()] || {};
  return rows.map((c) => (swaps[c.seat] ? { ...c, ...swaps[c.seat], swapped: true } : c));
}

function quoteKey() {
  const piece = list(state.selected).includes(state.piece) ? state.piece : (list(state.selected)[0] || "bed");
  return state.selected + ":" + piece + (state.alt ? ":alt" : "");
}

function showWarn(c) {
  return !!(c.warn && (state.chew || state.kids));
}

function photoTag(c, cls) {
  if (c.photo) return `<img src="${c.photo}" alt="${c.name}" class="${cls || ""}">`;
  return `<div class="ph" style="background:${c.color}"></div>`;
}

function strip() {
  const rows = pack();
  return `<div class="strip">${rows.map((c) => {
    const hold = c.job.toLowerCase();
    return `<button type="button" class="tile${state.sheet === c.seat ? " on" : ""}" data-act="open" data-id="${c.seat}" data-hold="${hold}" aria-describedby="hold-card">
      ${photoTag(c)}
      <span class="job">${c.job}</span>
      <div class="name">${c.name}</div>
      ${showWarn(c) ? `<span class="mark">${c.chip}</span>` : ""}
    </button>`;
  }).join("")}</div>`;
}

function sheet() {
  if (!state.sheet) return "";
  const c = pack().find((row) => row.seat === state.sheet);
  if (!c) return "";
  return `<div class="sheet" data-sheet="1">
    <div class="grab" aria-hidden="true"></div>
    ${photoTag(c)}
    <span class="job">${c.job}</span>
    <div class="name">${c.name}</div>
    <p class="botanical">${c.botanical}</p>
    <p class="meta">${c.meta || ""}</p>
    <p class="why">${c.why}</p>
    <span class="mini ${c.warn ? "warn" : ""}">${c.chip}</span>
    ${c.can_swap ? `<button class="swap" data-act="swap" data-id="${c.seat}" data-hold="swap-${c.seat}" aria-describedby="hold-card">Swap ${c.job}</button>` : ""}
  </div>`;
}

function screenAim() {
  return `<header>${glyph()}<span class="brand">Phoenix Yard</span></header>
    <main>
      <p class="line">Plants that match the wall.</p>
      <h1>Which way does the front face?</h1>
      <p class="lead">Street is the top. The notch is the front door. West warms itself.</p>
      ${yard()}
      <div class="compass">
        ${["N", "S", "E", "W"].map((id) =>
          `<button class="ans ${state.front === id ? "on" : ""}" data-act="front" data-id="${id}">${NAME[id]}</button>`
        ).join("")}
      </div>
    </main>
    <footer><button class="pri" data-act="mode" data-id="yard">That’s the front</button></footer>`;
}

function screenYard() {
  return `<header>${glyph()}<span class="brand">Phoenix Yard</span></header>
    <main>
      <p class="place">${placeLine()}</p>
      ${yard()}
      ${householdBar()}
      ${tray()}
      ${state.last ? `<p class="lead">${state.last}</p>` : ""}
    </main>
    <footer>
      <button class="ghost" data-act="mode" data-id="aim">Aim</button>
      <button class="pri" data-act="quote" ${hasAny() ? "" : "disabled"}>See the plants</button>
    </footer>
    <p style="text-align:center;margin:-8px 18px 20px"><button class="quiet" data-act="reset">Start over</button></p>`;
}

function screenQuote() {
  const piece = list(state.selected).includes(state.piece) ? state.piece : (list(state.selected)[0] || "bed");
  const label = piece === "block_wall" ? "block wall" : piece === "shade_tree" ? "tree" : piece;
  return `<header>${glyph()}<span class="brand">Phoenix Yard</span></header>
    <main>
      <p class="place">${NAME[bearing(state.selected)]} · ${label}</p>
      ${yard()}
      ${householdStatus()}
      ${segs()}
      ${state.last ? `<p class="lead">${state.last}</p>` : ""}
      ${list(state.selected).length ? strip() : `<p class="lead">Put something on a wall.</p>`}
    </main>
    <footer>
      <button class="ghost" data-act="mode" data-id="yard">Map</button>
      <button class="pri" data-act="reroll">Three others for this wall</button>
    </footer>
    ${sheet()}`;
}

function render() {
  const html = state.mode === "aim" ? screenAim() : state.mode === "quote" ? screenQuote() : screenYard();
  document.getElementById("app").innerHTML = html;
}

const holdCard = document.getElementById("hold-card");
let holdTimer = 0;
let holding = false;
let eatClick = false;

function hideHold() {
  clearTimeout(holdTimer);
  holdTimer = 0;
  holdCard.hidden = true;
  holdCard.style.display = "none";
  holdCard.textContent = "";
}

function placeHold(el) {
  const r = el.getBoundingClientRect();
  holdCard.style.left = Math.max(8, Math.min(window.innerWidth - 248, r.left)) + "px";
  const above = r.top - holdCard.offsetHeight - 12;
  holdCard.style.top = Math.max(8, above) + "px";
}

document.getElementById("app").addEventListener("pointerdown", (e) => {
  const el = e.target.closest("[data-hold]");
  if (!el) return;
  holding = false;
  try { el.setPointerCapture(e.pointerId); } catch (err) {}
  holdTimer = setTimeout(() => {
    holdCard.hidden = false;
    holdCard.style.display = "block";
    holdCard.textContent = HOLD[el.dataset.hold] || "";
    placeHold(el);
    holding = true;
    eatClick = true;
    state.sawHold = true;
  }, 420);
});
document.getElementById("app").addEventListener("pointerup", hideHold);
document.getElementById("app").addEventListener("pointercancel", hideHold);
document.getElementById("app").addEventListener("contextmenu", (e) => {
  if (e.target.closest("[data-hold]")) e.preventDefault();
});

document.getElementById("app").addEventListener("click", (e) => {
  if (eatClick && e.target.closest("[data-hold]")) {
    e.preventDefault();
    e.stopPropagation();
    eatClick = false;
    return;
  }
  eatClick = false;

  if (e.target.closest("[data-sheet]")) {
    const inner = e.target.closest("[data-act]");
    if (!inner && e.target.classList.contains("sheet")) {
      state.sheet = null;
      render();
    }
    if (!inner) return;
  } else if (state.sheet && !e.target.closest("[data-act='open']") && e.target.closest(".yard")) {
    state.sheet = null;
  }

  const b = e.target.closest("[data-act]");
  if (!b) return;
  const act = b.dataset.act;
  if (act === "front") state.front = b.dataset.id;
  if (act === "pick") {
    state.selected = b.dataset.id;
    const on = list(state.selected);
    if (on.length && !on.includes(state.piece)) state.piece = on[0];
    state.sheet = null;
    state.last = state.mode === "quote" && !on.length ? "Put something on a wall." : "";
  }
  if (act === "mode") {
    const from = state.mode;
    state.mode = b.dataset.id;
    state.last = "";
    state.sheet = null;
    if (from === "aim" && b.dataset.id === "yard") state.selected = westSide() || state.selected;
  }
  if (act === "stamp") {
    const side = state.selected;
    const next = list(side).slice();
    const i = next.indexOf(b.dataset.id);
    if (i >= 0) next.splice(i, 1);
    else next.push(b.dataset.id);
    state.surfaces[side] = next;
    state.piece = b.dataset.id;
    state.last = "";
  }
  if (act === "cover") state.cover[state.selected] = b.dataset.id;
  if (act === "piece") { state.piece = b.dataset.id; state.sheet = null; }
  if (act === "tog") state[b.dataset.id] = !state[b.dataset.id];
  if (act === "care") state.care = state.care === "Low" ? "Weekend" : state.care === "Weekend" ? "Hobby" : "Low";
  if (act === "quote") {
    if (!hasAny()) state.last = "Put something on a wall.";
    else { state.mode = "quote"; state.last = ""; state.sheet = null; }
  }
  if (act === "reroll") {
    state.alt = !state.alt;
    state.swaps[quoteKey()] = {};
    state.sheet = null;
    state.last = state.alt ? "Another legal set for this wall." : "Back to this wall’s first set.";
  }
  if (act === "open") state.sheet = b.dataset.id;
  if (act === "swap") {
    const key = quoteKey();
    const cur = Object.assign({}, state.swaps[key] || {});
    if (cur[b.dataset.id]) delete cur[b.dataset.id];
    else cur[b.dataset.id] = SWAP[b.dataset.id];
    state.swaps[key] = cur;
    state.last = "Swapped one plant. The other two stayed.";
  }
  if (act === "reset") {
    state.surfaces = { front: [], left: [], right: [], back: [] };
    state.cover = { front: "none", left: "none", right: "none", back: "none" };
    state.kids = false; state.chew = false; state.wildlife = true; state.care = "Low";
    state.alt = false; state.swaps = {}; state.last = ""; state.mode = "aim"; state.sheet = null;
  }
  render();
});

let sheetStart = 0;
document.getElementById("app").addEventListener("pointerdown", (e) => {
  if (e.target.closest(".grab") || (e.target.classList.contains("sheet") && e.offsetY < 28)) {
    sheetStart = e.clientY;
  } else sheetStart = 0;
});
document.getElementById("app").addEventListener("pointerup", (e) => {
  if (sheetStart && e.clientY - sheetStart > 48) {
    state.sheet = null;
    sheetStart = 0;
    render();
  }
});

render();
</script>
</body>
</html>
